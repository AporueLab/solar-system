            <div class="hotspot" id="enceladus" data-title="Enceladus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/PIA17202_-_Approaching_Enceladus.jpg/960px-PIA17202_-_Approaching_Enceladus.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A small but extraordinarily active moon of Saturn, Enceladus is one of the most important targets in the search for extraterrestrial life in the Solar System.<br><br><b>Distance from Saturn:</b> Orbits at an average of 238,000 km, completing one orbit every 1.37 Earth days. It is tidally locked to Saturn.<br><br><b>Distance from the Sun:</b> Shares Saturn's average distance of 9.58 AU - approximately 1.43 billion kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 504 km.<br><br><b>Composition:</b> Primarily water ice with a rocky core. Beneath its icy crust lies a global subsurface ocean of liquid water.<br><br><b>Notable Features:</b> Enceladus ejects massive plumes of water vapor, ice particles, and organic compounds from fractures near its south pole, known as tiger stripes. These geysers feed Saturn's E ring and provide direct evidence of an underground ocean that is in contact with rock, which is a key condition for potential life. Measurements from the Cassini spacecraft detected salts and organic molecules in the plumes, making Enceladus one of the most exciting environments to search for alien life.<br><br><a href='https://en.wikipedia.org/wiki/Enceladus' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="mimas" data-title="Mimas" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Mimas_Masked.jpg/960px-Mimas_Masked.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A small icy moon of Saturn best known for a single overwhelming feature that defines its entire appearance - and has earned it an unfortunate cultural comparison.<br><br><b>Distance from Saturn:</b> Orbits at an average of 185,500 km, completing one orbit every 0.94 Earth days. It is tidally locked to Saturn.<br><br><b>Distance from the Sun:</b> As part of the Saturnian system, it orbits at an average of 9.58 AU - approximately 1.43 billion kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 396 km.<br><br><b>Composition:</b> Mostly water ice with a small amount of rock, giving it a low density and relatively weak structural integrity.<br><br><b>Notable Features:</b> The massive Herschel crater, about 130 km across, dominates Mimas' surface and gives it a striking resemblance to a certain fictional battle station - a comparison that, regrettably, is not inaccurate. The impact that created it nearly shattered the moon entirely. Apart from this, Mimas is heavily cratered and shows no signs of geological activity, making it one of the most inert bodies in the Solar System.<br><br><a href='https://en.wikipedia.org/wiki/Mimas' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="hyperion" data-title="Hyperion" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Hyperion_true.jpg/960px-Hyperion_true.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>An irregularly shaped moon of Saturn with a sponge-like appearance, Hyperion is one of the most unusual objects in the Solar System - not only in shape, but in how it moves through space.<br><br><b>Distance from Saturn:</b> Orbits at an average of 1,481,000 km, completing one orbit every 21.3 Earth days. Its rotation is chaotic, meaning it tumbles unpredictably rather than maintaining a stable orientation.<br><br><b>Distance from the Sun:</b> Shares Saturn's average distance of 9.58 AU - approximately 1.43 billion kilometres from the Sun.<br><br><b>Size:</b> Approximately 270 × 205 × 163 km - highly irregular in shape rather than spherical.<br><br><b>Composition:</b> A porous mixture of water ice and rock with very low density - suggesting a loosely packed, sponge-like internal structure with significant empty space.<br><br><b>Notable Features:</b> Hyperion's surface is covered in deep, sharp-edged craters that give it a distinctly porous, almost organic appearance. Its chaotic rotation is caused by gravitational interactions with Saturn and nearby Titan, making its orientation impossible to predict over long timescales. Unlike most moons, it does not settle into tidal locking, making it dynamically unique among large satellites.<br><br><a href='https://en.wikipedia.org/wiki/Hyperion_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="phoebe" data-title="Phoebe" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Phoebe_cassini_full.jpg/960px-Phoebe_cassini_full.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>An outer moon of Saturn with a distinctly alien origin, Phoebe is a captured object from the distant outer Solar System, likely related to Kuiper Belt bodies.<br><br><b>Distance from Saturn:</b> Orbits at an average of 12.95 million km, taking about 550 Earth days to complete one orbit. Its orbit is retrograde, moving opposite to Saturn's rotation.<br><br><b>Distance from the Sun:</b> Shares Saturn's average distance of 9.58 AU - approximately 1.43 billion kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 213 km.<br><br><b>Composition:</b> A mixture of rock, ice, and carbon-rich compounds, giving it a very dark surface compared to Saturn's inner moons.<br><br><b>Notable Features:</b> Phoebe's retrograde and highly inclined orbit clearly indicates it did not form with Saturn but was captured by its gravity. Its dark material is thought to contribute to the coating of Iapetus' leading hemisphere. Heavily cratered and irregular, Phoebe provides insight into primitive Solar System material far from the Sun.<br><br><a href='https://en.wikipedia.org/wiki/Phoebe_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="janus" data-title="Janus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/PIA12714_Janus_crop.jpg/960px-PIA12714_Janus_crop.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A small inner moon of Saturn notable not for its size, but for its unusual orbital relationship with its neighbour Epimetheus - a rare example of co-orbital dynamics.<br><br><b>Distance from Saturn:</b> Orbits at an average of 151,500 km, sharing a nearly identical orbit with Epimetheus, completing one orbit every 0.69 Earth days.<br><br><b>Distance from the Sun:</b> As part of the Saturnian system, it orbits at an average of 9.58 AU - approximately 1.43 billion kilometres from the Sun.<br><br><b>Size:</b> Mean diameter of approximately 179 km.<br><br><b>Composition:</b> Primarily water ice with some rocky material, typical of Saturn's inner moons.<br><br><b>Notable Features:</b> Janus and Epimetheus periodically swap orbital positions every few years in a gravitational interaction that prevents collision - a delicate and stable exchange that is unique among known moons. Its surface is irregular and cratered, reflecting a long history of impacts with little geological change.<br><br><a href='https://en.wikipedia.org/wiki/Janus_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="ganymede" data-title="Ganymede" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Ganymede_-_Perijove_34_Composite.png/960px-Ganymede_-_Perijove_34_Composite.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The largest moon in the Solar System, Ganymede is bigger than the planet Mercury and possesses a level of internal complexity that rivals small planets.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 1,070,400 km, completing one orbit every 7.15 Earth days. It is tidally locked to Jupiter.<br><br><b>Distance from the Sun:</b> As part of the Jovian system, it orbits at an average of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 5,268 km - the largest moon in the Solar System.<br><br><b>Composition:</b> A differentiated body with a metallic core, rocky mantle, and icy crust. It is the only moon known to generate its own magnetic field.<br><br><b>Notable Features:</b> Ganymede's surface shows a mix of ancient, heavily cratered regions and younger, grooved terrain formed by tectonic activity. Beneath its icy shell, it is believed to host a deep subsurface ocean containing more water than all of Earth's oceans combined. Its magnetic field creates auroras, making it uniquely planet-like among moons.<br><br><a href='https://en.wikipedia.org/wiki/Ganymede_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="callisto" data-title="Callisto" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Callisto_VGR2_C2060635_OGB.png/960px-Callisto_VGR2_C2060635_OGB.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The outermost of Jupiter's four large Galilean moons, Callisto is a heavily cratered and ancient world that has remained largely unchanged for billions of years.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 1,882,700 km, taking 16.69 Earth days to complete one orbit. It is tidally locked to Jupiter.<br><br><b>Distance from the Sun:</b> Shares Jupiter's average distance of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 4,821 km - the third largest moon in the Solar System.<br><br><b>Composition:</b> A mixture of ice and rock that appears only partially differentiated, with no fully developed core structure.<br><br><b>Notable Features:</b> Callisto's surface is one of the oldest in the Solar System and is covered completely with impact craters. Its most prominent structure is Valhalla, a massive multi-ring impact basin spanning thousands of kilometers. Unlike Ganymede or Europa, Callisto shows little evidence of internal activity, though a subsurface ocean may still exist deep beneath its crust. Its relatively low radiation environment makes it a good candidate for future human exploration.<br><br><a href='https://en.wikipedia.org/wiki/Callisto_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="io" data-title="Io" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Io_highest_resolution_natural_color.png/960px-Io_highest_resolution_natural_color.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The most volcanically active body in the Solar System, Io is a world of constant eruption, reshaping its surface on timescales that would make most planets envious.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 421,700 km, completing one orbit every 1.77 Earth days. It is tidally locked to Jupiter.<br><br><b>Distance from the Sun:</b> As part of the Jovian system, it orbits at an average of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 3,643 km.<br><br><b>Composition:</b> Primarily rock, with little water ice. Its interior is heated by intense tidal forces from Jupiter and neighbouring moons.<br><br><b>Notable Features:</b> Io's surface is covered in hundreds of active volcanoes, some erupting plumes up to 500 km high. Its vivid colours-yellows, reds, and blacks-come from sulfur and sulfur compounds deposited by constant volcanic activity. The extreme tidal heating prevents impact craters from accumulating, continuously renewing the surface.<br><br><a href='https://en.wikipedia.org/wiki/Io_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="europa" data-title="Europa" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Europa_-_Perijove_45_%28cropped%29.png/960px-Europa_-_Perijove_45_%28cropped%29.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A smooth, ice-covered moon of Jupiter, Europa is one of the most promising places in the Solar System to search for extraterrestrial life.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 670,900 km, completing one orbit every 3.55 Earth days. It is tidally locked to Jupiter.<br><br><b>Distance from the Sun:</b> Shares Jupiter's average distance of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 3,122 km.<br><br><b>Composition:</b> A rocky interior covered by a thick shell of water ice. Beneath this crust lies a global subsurface ocean of liquid water.<br><br><b>Notable Features:</b> Europa's surface is remarkably smooth, with few craters and a network of dark streaks and fractures caused by tidal flexing. Evidence suggests that its subsurface ocean may contain more than twice the volume of Earth's oceans. Interaction between water and rock on the ocean floor could provide the chemical energy necessary for life, making Europa a prime target for future exploration missions.<br><br><a href='https://en.wikipedia.org/wiki/Europa_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="amalthea" data-title="Amalthea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Amalthea_PIA02532.png/330px-Amalthea_PIA02532.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A small, irregularly shaped inner moon of Jupiter, Amalthea orbits deep within the planet's intense radiation environment.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 181,400 km, completing one orbit every 0.50 Earth days - about 12 hours.<br><br><b>Distance from the Sun:</b> As part of the Jovian system, it orbits at an average of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Approximately 250 × 146 × 128 km - irregular in shape rather than spherical.<br><br><b>Composition:</b> Likely composed of porous water ice mixed with darker material, despite its proximity to Jupiter where such ice might be expected to sublimate.<br><br><b>Notable Features:</b> Amalthea has an uneven, heavily cratered surface with large depressions and ridges. Its low density suggests it may be a loosely bound “rubble pile.” It also contributes material to Jupiter's faint ring system, shedding dust due to micrometeorite impacts.<br><br><a href='https://en.wikipedia.org/wiki/Amalthea_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="himalia" data-title="Himalia" data-desc="<br>The largest of Jupiter's irregular outer moons, Himalia is part of a distant group of satellites believed to have originated from a captured asteroid.<br><br><b>Distance from Jupiter:</b> Orbits at an average of approximately 11.5 million km, taking about 250 Earth days to complete one orbit. Its orbit is inclined and slightly eccentric.<br><br><b>Distance from the Sun:</b> Shares Jupiter's average distance of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 170 km.<br><br><b>Composition:</b> Likely composed of rock and ice with a dark surface, similar to C-type asteroids.<br><br><b>Notable Features:</b> Himalia is the largest member of the Himalia group, a family of moons with similar orbits that likely formed from the fragmentation of a single captured body. Its irregular shape and distant orbit distinguish it from Jupiter's larger, more regular moons.<br><br><a href='https://en.wikipedia.org/wiki/Himalia_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="thebe" data-title="Thebe" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/1/1b/Thebe.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>An inner moon of Jupiter, Thebe orbits just beyond Amalthea and shares a similarly irregular shape and darkened surface.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 221,900 km, completing one orbit every 0.67 Earth days - roughly 16 hours.<br><br><b>Distance from the Sun:</b> As part of the Jovian system, it orbits at an average of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Approximately 116 × 98 × 84 km - irregular and non-spherical.<br><br><b>Composition:</b> Likely composed of porous ice mixed with darker rocky material, with a low density suggesting a loosely consolidated structure.<br><br><b>Notable Features:</b> Thebe's surface is heavily cratered, with large impact features relative to its size. Like Amalthea, it contributes dust to Jupiter's faint ring system, forming part of the Thebe ring. Its proximity to Jupiter subjects it to strong tidal forces and intense radiation.<br><br><a href='https://en.wikipedia.org/wiki/Thebe_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="elara" data-title="Elara" data-desc="<br>One of Jupiter's larger irregular outer moons, Elara is part of a distant group of satellites that likely originated from a captured and fragmented parent body.<br><br><b>Distance from Jupiter:</b> Orbits at an average of approximately 11.7 million km, taking about 259 Earth days to complete one orbit. Its orbit is inclined and slightly eccentric.<br><br><b>Distance from the Sun:</b> Shares Jupiter's average distance of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 86 km.<br><br><b>Composition:</b> Likely composed of rock and ice with a dark, non-reflective surface, similar to other irregular moons.<br><br><b>Notable Features:</b> Elara belongs to the Himalia group, a cluster of moons with similar orbital characteristics, suggesting a common origin from a captured asteroid that later fragmented. Its distant orbit places it far from Jupiter's regular moon system, in a dynamically complex region.<br><br><a href='https://en.wikipedia.org/wiki/Elara_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="metis" data-title="Metis" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/9/9a/Metis.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The innermost known moon of Jupiter, Metis orbits extremely close to the planet, within a region dominated by strong tidal forces.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 128,000 km, completing one orbit every 0.29 Earth days - about 7 hours.<br><br><b>Distance from the Sun:</b> As part of the Jovian system, it orbits at an average of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Approximately 60 × 40 × 34 km - highly irregular in shape.<br><br><b>Composition:</b> Likely composed of porous rock and ice, though its proximity to Jupiter raises questions about long-term stability.<br><br><b>Notable Features:</b> Metis orbits within Jupiter's main ring and is a primary source of ring material, shedding dust due to constant micrometeorite impacts. Its orbit lies close to Jupiter's Roche limit, where tidal forces could potentially disrupt loosely bound bodies. Despite this, it remains intact - for now.<br><br><a href='https://en.wikipedia.org/wiki/Metis_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="adrastea" data-title="Adrastea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/e/e4/Adrastea.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>A tiny inner moon of Jupiter, Adrastea is one of the smallest known moons in the Solar System and orbits extremely close to the planet.<br><br><b>Distance from Jupiter:</b> Orbits at an average of 129,000 km, completing one orbit every 0.30 Earth days - just over 7 hours.<br><br><b>Distance from the Sun:</b> Shares Jupiter's average distance of 5.2 AU - approximately 778 million kilometres from the Sun.<br><br><b>Size:</b> Estimated dimensions of approximately 20 × 16 × 14 km - irregular and very small.<br><br><b>Composition:</b> Likely composed of rock and ice, with a darkened surface due to space weathering.<br><br><b>Notable Features:</b> Adrastea orbits within Jupiter's main ring and contributes material to it, similar to Metis. Its extremely close orbit places it deep within Jupiter's gravitational and radiation environment. It was one of the first moons discovered by spacecraft rather than Earth-based observation, identified in images from Voyager 2.<br><br><a href='https://en.wikipedia.org/wiki/Adrastea_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="ceres" data-title="Ceres" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/7/76/Ceres_-_RC3_-_Haulani_Crater_%2822381131691%29_%28cropped%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The largest object in the asteroid belt and the only one classified as a dwarf planet, Ceres represents a transitional world between rocky asteroids and icy bodies of the outer Solar System.<br><br><b>Distance from the Sun:</b> Orbits at an average of 2.77 AU - approximately 414 million kilometres from the Sun.<br><br><b>Orbital Period:</b> One Ceres year lasts about 4.6 Earth years.<br><br><b>Size:</b> Diameter of approximately 940 km - accounting for about one-third of the total mass of the asteroid belt.<br><br><b>Composition:</b> A mixture of rock and water ice, with evidence of hydrated minerals and possibly a subsurface briny layer.<br><br><b>Notable Features:</b> Ceres displays evidence of a surprisingly complex and active history for its size. Its interior likely consists of a rocky core or muddy mantle beneath an ice–salt–clay crust, with water ice making up an estimated 25–30% of its volume. Bright deposits in Occator Crater, including Cerealia and Vinalia Faculae, are composed of sodium salts left behind by briny water reaching the surface. The dwarf planet also hosts Ahuna Mons, a geologically young cryovolcano, along with other cryovolcanic domes that have gradually relaxed over time.<br><br>Organic compounds have been detected on the surface, particularly near Ernutet Crater, suggesting a carbon-rich composition. Ceres possesses a transient water-vapour exosphere, likely generated by sublimation or low-level venting. Altogether, features such as brine migration, surface relaxation, and cryovolcanism indicate that Ceres remained geologically active far longer than expected for a body of its size.<br><br><a href='https://en.wikipedia.org/wiki/Ceres_(dwarf_planet)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="vesta" data-title="Vesta" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Vesta_in_natural_color.jpg/960px-Vesta_in_natural_color.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The second most massive object in the asteroid belt, Vesta is a protoplanet - a body that began forming into a planet but never completed the process.<br><br><b>Distance from the Sun:</b> Orbits at an average of 2.36 AU - approximately 353 million kilometres from the Sun.<br><br><b>Orbital Period:</b> One Vesta year lasts about 3.63 Earth years.<br><br><b>Size:</b> Mean diameter of approximately 525 km.<br><br><b>Composition:</b> Differentiated into a crust, mantle, and core - similar to terrestrial planets. Its surface is primarily basaltic rock, indicating past volcanic activity.<br><br><b>Notable Features:</b> Vesta hosts one of the largest impact basins in the Solar System, Rheasilvia, at its south pole, with a central peak rising about 22 kilometers high. Many meteorites found on Earth are believed to come from Vesta, linking it directly to the study of planetary geology. It was also visited by the Dawn spacecraft, which revealed a complex and geologically evolved body.<br><br><a href='https://en.wikipedia.org/wiki/Vesta_(asteroid)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="pallas" data-title="Pallas" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/d/d4/Potw1749a_Pallas_crop.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>One of the largest objects in the asteroid belt, Pallas follows an unusually inclined orbit, making it dynamically distinct from many of its neighbours.<br><br><b>Distance from the Sun:</b> Orbits at an average of 2.77 AU - approximately 414 million kilometres from the Sun, similar to Ceres but on a much steeper orbital path.<br><br><b>Orbital Period:</b> One Pallas year lasts about 4.6 Earth years.<br><br><b>Size:</b> Mean diameter of approximately 512 km.<br><br><b>Composition:</b> Likely composed of silicate rock with some water-bearing minerals, though it appears less differentiated than Vesta.<br><br><b>Notable Features:</b> Pallas' orbit is highly inclined (about 34 degrees), making it one of the most tilted large bodies in the Solar System. Its surface is heavily cratered and relatively poorly studied compared to Ceres and Vesta, as no spacecraft has visited it. Its unusual orbit suggests a more chaotic early history within the asteroid belt.<br><br><a href='https://en.wikipedia.org/wiki/2_Pallas' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="hygiea" data-title="Hygiea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/SPHERE_image_of_Hygiea.jpg/960px-SPHERE_image_of_Hygiea.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The fourth largest object in the asteroid belt, Hygiea is a dark and relatively low-density body that may qualify as a dwarf planet due to its nearly spherical shape.<br><br><b>Distance from the Sun:</b> Orbits at an average of 3.14 AU - approximately 470 million kilometres from the Sun.<br><br><b>Orbital Period:</b> One Hygiea year lasts about 5.57 Earth years.<br><br><b>Size:</b> Mean diameter of approximately 434 km.<br><br><b>Composition:</b> Likely composed of carbon-rich material mixed with water-bearing minerals, giving it a very dark surface.<br><br><b>Notable Features:</b> Observations suggest Hygiea has a surprisingly spherical shape for its size, raising the possibility that it meets the criteria for dwarf planet status. It appears to have been heavily disrupted by a past collision and may be the largest remnant of a once larger parent body. It is the dominant member of the Hygiea asteroid family.<br><br><a href='https://en.wikipedia.org/wiki/10_Hygiea' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="phobos" data-title="Phobos" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Phobos_colour_2008.jpg/960px-Phobos_colour_2008.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The larger and innermost of Mars' two moons, Phobos is a small, irregularly shaped body that orbits so close to its planet that it rises and sets multiple times each Martian day.<br><br><b>Distance from Mars:</b> Orbits at an average of 6,000 km, completing one orbit every 7 hours and 39 minutes - faster than Mars rotates.<br><br><b>Distance from the Sun:</b> As part of the Martian system, it orbits at an average of 1.52 AU - approximately 228 million kilometres from the Sun.<br><br><b>Size:</b> Approximately 27 × 22 × 18 km - irregular in shape.<br><br><b>Composition:</b> Likely composed of carbon-rich rock mixed with ice, similar to C-type asteroids, though its exact origin remains debated.<br><br><b>Notable Features:</b> Phobos is dominated by the massive Stickney crater, nearly half the moon's diameter, along with grooves and fractures likely caused by past impacts and tidal stresses. Its orbit is gradually decaying due to tidal interactions with Mars, and it is expected to either break apart into a ring or impact the planet within tens of millions of years.<br><br><a href='https://en.wikipedia.org/wiki/Phobos_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="deimos" data-title="Deimos" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/8/86/NASA-Deimos-MarsMoon-20090221.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The smaller and outermost moon of Mars, Deimos is smoother and more rounded than Phobos, with fewer large craters and a more subdued appearance.<br><br><b>Distance from Mars:</b> Orbits at an average of 23,500 km, completing one orbit every 30.3 hours.<br><br><b>Distance from the Sun:</b> Shares Mars' average distance of 1.52 AU - approximately 228 million kilometres from the Sun.<br><br><b>Size:</b> Approximately 15 × 12 × 11 km - small and irregular, though more rounded than Phobos.<br><br><b>Composition:</b> Likely composed of porous rock and ice, similar to Phobos, with a surface covered in a thick layer of regolith that has softened its features.<br><br><b>Notable Features:</b> Deimos has far fewer large craters than Phobos, likely due to surface material gradually smoothing over impacts. Its origin remains uncertain, with theories ranging from captured asteroid to formation from debris around Mars. Its relatively stable orbit contrasts with the slow inward spiral of Phobos.<br><br><a href='https://en.wikipedia.org/wiki/Deimos_(moon)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="themoon" data-title="The Moon" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/960px-FullMoon2010.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Earth's only natural satellite, the Moon is the fifth largest moon in the Solar System and the only extraterrestrial body ever visited by humans.<br><br><b>Distance from Earth:</b> Orbits at an average of 384,400 km, completing one orbit every 27.3 days. Its rotation is tidally locked, always showing the same face to Earth.<br><br><b>Distance from the Sun:</b> As part of the Earth system, it orbits at an average of 1 AU - approximately 150 million kilometres from the Sun.<br><br><b>Size:</b> Diameter of approximately 3,474 km.<br><br><b>Composition:</b> A differentiated body with a small core, rocky mantle, and crust composed largely of silicate minerals. The surface is covered in regolith formed by billions of years of impacts.<br><br><b>Notable Features:</b> The Moon's surface is divided into bright highlands and darker basaltic plains known as maria, formed by ancient volcanic activity. It likely formed following a massive collision between the early Earth and a Mars-sized body, with debris coalescing into the Moon. Its gravitational influence stabilizes Earth's axial tilt and drives ocean tides. Human missions during the Apollo program (1969–1972) returned samples and transformed our understanding of planetary formation.<br><br><a href='https://en.wikipedia.org/wiki/Moon' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="system" data-title="The Solar System" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Solar_System_true_color_%28captions%29.jpg/960px-Solar_System_true_color_%28captions%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The Solar System is a gravitationally bound system centered on the Sun, consisting of planets, moons, dwarf planets, asteroids, comets, and vast populations of smaller objects - all formed approximately 4.6 billion years ago from a collapsing cloud of gas and dust.<br><br><b>Structure:</b> The system is broadly divided into regions: the inner rocky planets (Mercury, Venus, Earth, Mars), the asteroid belt, the gas and ice giants (Jupiter, Saturn, Uranus, Neptune), the Kuiper Belt, and the distant, spherical Oort Cloud. Each region reflects differences in temperature and material during formation.<br><br><b>Scale:</b> The Solar System spans billions of kilometres. Neptune orbits at about 30 AU (4.5 billion kilometres), while the Oort Cloud may extend up to 100,000 AU - nearly 1.5 light-years - placing its outer boundary closer to neighbouring stars than to the Sun itself.<br><br><b>Composition:</b> About 99.8% of the system's total mass resides in the Sun. The remaining fraction forms planets and smaller bodies composed of rock, metal, ice, and gas, with increasing ice content further from the Sun.<br><br><b>Dynamics:</b> Most objects orbit in the same plane and direction, a remnant of the original rotating protoplanetary disk. Gravitational interactions, particularly with giant planets like Jupiter, continue to shape the system by capturing, ejecting, or perturbing smaller bodies.<br><br><b>Notable Features:</b> The Solar System contains a diverse range of worlds - from volcanic Io and ocean-bearing Europa to the methane lakes of Titan and the icy dwarf planets beyond Neptune. It is also the only known system to host life, with Earth providing the necessary conditions for its emergence. Ongoing exploration continues to reveal a far more dynamic and complex system than once imagined.<br><br><a href='https://en.wikipedia.org/wiki/Solar_System' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="aboutCZ" data-title="About" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Sluneční soustava slouží jako interaktivní vzdělávací průvodce naším kosmickým sousedstvím.<br><br>Projekt vytvořil Josef Handsuch v květnu roku 2026 s využitím programů VSCodium a Photoshop, materiálů z Wikipedie a za asistence umělé inteligence Gemini a Claude. Tato aplikace představuje osobní závazek ke vzdělávání v oblasti astronomie.<br>"></div>

            <div class="hotspot" id="about" data-title="About" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>The Solar System serves as an interactive educational guide to our cosmic neighborhood.<br><br>Developed between May and June 2026 by Josef Handsuch, the project utilizes VSCodium, Photoshop, and Wikipedia, alongside AI assistance from Gemini and Claude. This application represents a personal commitment to astronomy education."></div>

            <div class="hotspot" id="projects" data-title="Other projects" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br><a href='https://aporuelab.github.io/earth-chronicle'>The Earth Chronicle</a><br>An interactive geologic time scale of Earth"></div>

            <div class="hotspot" id="language" data-title="Česká verze" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/1DxNidozMuQLh0gnFaa2l_0GfoSt0e7jt' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br><a href='https://aporuelab.github.io/solar-system/cz.html'>PŘEPNOUT</a>"></div>


        </div>
    </div>

    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9998;"></div>
    <div class="tooltip" id="info-bubble">
        <div class="tooltip-content">
            <h3 id="bubble-title">Title</h3>
            <p id="bubble-desc">Description goes here.</p>
        </div>
        <div class="tooltip-footer">
            <button id="close-btn">Close</button>
        </div>
    </div>

    <!-- BOOKMARK: Script  -->
    <script>
        window.addEventListener('load', function () {
            const hotspots = document.querySelectorAll('.hotspot');
            hotspots.forEach(spot => {
                const desc = spot.getAttribute('data-desc');
                const match = desc.match(/src=['"]([^'"]+)['"]/);
                if (match && match[1]) {
                    const preloadImg = new Image();
                    preloadImg.src = match[1];
                }
            });
        });

        const hotspots = document.querySelectorAll('.hotspot');
        const bubble = document.getElementById('info-bubble');
        const bubbleTitle = document.getElementById('bubble-title');
        const bubbleDesc = document.getElementById('bubble-desc');
        const closeBtn = document.getElementById('close-btn');

        function preventBodyTouch(e) {
            if (!bubble.contains(e.target)) {
                e.preventDefault();
            }
        }

        function openBubble() {
            document.getElementById('overlay').style.display = 'block';
            bubble.style.display = 'flex';
            document.addEventListener('touchmove', preventBodyTouch, { passive: false });
            positionBubble();
        }

        function positionBubble() {
            if (window.visualViewport) {
                const vv = window.visualViewport;
                const scale = 1 / vv.scale;
                bubble.style.position = 'fixed';
                bubble.style.top = (vv.offsetTop + vv.height / 2) + 'px';
                bubble.style.left = (vv.offsetLeft + vv.width / 2) + 'px';
                bubble.style.transform = `translate(-50%, -50%) scale(${scale})`;
                bubble.style.transformOrigin = 'center center';
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('scroll', () => {
                if (bubble.style.display === 'flex') positionBubble();
            });
            window.visualViewport.addEventListener('resize', () => {
                if (bubble.style.display === 'flex') positionBubble();
            });
        }

        function closeBubble() {
            bubble.style.display = 'none';
            bubble.style.transform = 'translate(-50%, -50%)';
            document.getElementById('overlay').style.display = 'none';
            document.body.style.overflow = '';
            document.removeEventListener('touchmove', preventBodyTouch);
        }


        hotspots.forEach(spot => {
            spot.addEventListener('click', (e) => {
                e.stopPropagation();
                bubbleTitle.textContent = spot.getAttribute('data-title');
                bubbleDesc.innerHTML = spot.getAttribute('data-desc');
                openBubble();
            });
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeBubble();
        });

        document.addEventListener('click', (e) => {
            const isClickInsideBubble = bubble.contains(e.target);
            const isClickOnHotspot = Array.from(hotspots).some(spot => spot.contains(e.target));
            if (!isClickInsideBubble && !isClickOnHotspot) {
                closeBubble();
            }
        });

        function positionHeader() {
            if (window.visualViewport) {
                const vv = window.visualViewport;
                const header = document.getElementById('fixed-header');
                header.style.top = vv.offsetTop + 'px';
                header.style.left = vv.offsetLeft + 'px';
                header.style.width = vv.width + 'px';

                // Counteract zoom
                const scale = 1 / vv.scale;
                header.style.transformOrigin = 'top left';
                header.style.transform = `scale(${scale})`;
                header.style.width = (vv.width * vv.scale) + 'px';

                document.getElementById('header-spacer').style.height = header.offsetHeight + 'px';
            }
        }

        positionHeader();

        if (window.visualViewport) {
            window.visualViewport.addEventListener('scroll', positionHeader);
            window.visualViewport.addEventListener('resize', positionHeader);
        }

        window.addEventListener('load', function () {
            const hotspots = document.querySelectorAll('.hotspot');
            hotspots.forEach(spot => {
                const desc = spot.getAttribute('data-desc');
                const match = desc.match(/src=['"]([^'"]+)['"]/);
                if (match && match[1]) {
                    const preloadImg = new Image();
                    preloadImg.src = match[1];
                }
            });
        });



    </script>
