            #scroll-wrapper {
                width: 200vw;
                margin-left: 0;

                text-align: center;
                width: 100vw;
            }

            .main-subtitle {
                font-size: 0.65rem;
                width: 100vw;
                text-align: center;
            }

                margin: 0;
                width: 200vw;
            }

                width: 200vw;

                margin: 0;
                display: block;

            .tooltip {

                max-height: 85vh;

<body>

    <!-- BOOKMARK: Text  -->
    <div id="fixed-header">
        <h1 class="main-title">Sluneční soustava</h1>
        <p class="main-subtitle">Průvodce naším kosmickým sousedstvím<br><br>Klepnutím prozkoumejte</p>
        <button id="quiz-launch" type="button" aria-haspopup="dialog">KVÍZ</button>
    </div>
    <div id="header-spacer"></div>
    <div id="scroll-wrapper">
        <div class="image-container">
            <img src="https://lh3.googleusercontent.com/u/0/d/19tQyscTDoiXY6z-6udzDkWis90rwGuJD" alt="Schéma Sluneční soustavy">

            <div class="hotspot" id="body" data-title="Astronomický objekt" data-desc="<br>Přirozeně se vyskytující fyzikální útvar, soustava nebo struktura ve vesmíru. V astronomii se pojmy astronomický objekt a astronomické těleso často používají zaměnitelně. Přesněji však astronomické těleso označuje jednotlivý, prostorově souvislý a gravitačně či jinak pevně vázaný útvar. Astronomický objekt může mít i složitější strukturu a zahrnovat více těles nebo dalších objektů.<br><br><a href='https://cs.wikipedia.org/wiki/Astronomick%C3%BD_objekt' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="moons" data-title="Přirozené družice" data-desc="<br>Přirozená družice je astronomické těleso, které obíhá kolem planety, trpasličí planety nebo menšího tělesa Sluneční soustavy; výjimečně může obíhat i kolem jiné přirozené družice. Přirozeným družicím se běžně říká měsíce podle Měsíce, přirozené družice Země, známé také pod klasickými jmény Seléné nebo Luna. V angličtině se názvem Moon s velkým počátečním písmenem označuje zemský Měsíc, zatímco moon s malým písmenem znamená přirozenou družici obecně.<br><br>Podle údajů NASA bylo v říjnu 2026 oficiálně uznáno 461 měsíců obíhajících kolem planet a Pluta. Přirozené družice známe také u dalších trpasličích planet, planetek a transneptunických těles. Jejich počty se s potvrzováním nových objevů mění.<br><br><a href='https://cs.wikipedia.org/wiki/Astronomick%C3%BD_objekt' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="au" data-title="Astronomická jednotka" data-desc="<br>Jednotka délky přesně definovaná jako 149 597 870 700 metrů. Historicky byla astronomická jednotka odvozena od průměrné vzdálenosti Země od Slunce, respektive od průměru vzdáleností Země od Slunce v přísluní a odsluní. V roce 2012 však získala současnou přesnou definici.<br><br>Astronomická jednotka se používá především k vyjadřování vzdáleností ve Sluneční soustavě a v okolí dalších hvězd. Je také základem definice jiné astronomické jednotky délky, parseku. Jedna astronomická jednotka odpovídá přibližně 499 světelným sekundám.<br><br><a href='https://cs.wikipedia.org/wiki/Astronomick%C3%A1_jednotka' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="kuiper" data-title="Kuiperův pás" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Kuiper_belt_plot_objects_of_outer_solar_system.png/960px-Kuiper_belt_plot_objects_of_outer_solar_system.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Rozsáhlá oblast vnější Sluneční soustavy za oběžnou dráhou Neptunu, obývaná stovkami tisíc ledových těles, trpasličími planetami a zmrzlými pozůstatky z doby vzniku Sluneční soustavy před 4,6 miliardy let.<br><br><b>Vzdálenost od Slunce:</b> Rozprostírá se přibližně od 30 do 50 astronomických jednotek, tedy zhruba od 4,5 do 7,5 miliardy kilometrů od Slunce. Některé rozptýlené objekty, například Sedna, se dostávají daleko za tyto hranice.<br><br><b>Rozměry a hmotnost:</b> Tato široká oblast ve tvaru prstence má radiální šířku přibližně 20 astronomických jednotek. Přestože obsahuje stovky tisíc ledových těles, její celková hmotnost se odhaduje jen asi na 0,04 hmotnosti Země. Na kosmické poměry jde o mimořádně řídkou oblast.<br><br><b>Složení:</b> Převládají zmrzlé těkavé látky – voda, amoniak a metan – smíšené s horninami a prachem. Takzvané studené klasické objekty Kuiperova pásu představují pozůstatky vzniku Sluneční soustavy před přibližně 4,6 miliardy let.<br><br><b>Významné objekty:</b> Nejznámějším obyvatelem je Pluto, trpasličí planeta s pěti měsíci, z nichž největší je Charon. Eris má o něco větší hmotnost než Pluto, přestože je menší. Sedna obíhá po mimořádně protáhlé dráze a jeden oběh kolem Slunce jí trvá přibližně 11 000 let.<br><br><b>Úloha ve Sluneční soustavě:</b> Kuiperův pás je hlavním zdrojem krátkoperiodických komet, tedy komet s oběžnou dobou kratší než 200 let. Gravitační působení Neptunu občas vychýlí některá tělesa směrem dovnitř soustavy a nasměruje je k vnitřním planetám.<br><br><a href='https://cs.wikipedia.org/wiki/Kuiper%C5%AFv_p%C3%A1s' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="neptune" data-title="Neptun" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Neptune_Voyager2_color_calibrated.png/960px-Neptune_Voyager2_color_calibrated.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Osmá a nejvzdálenější planeta od Slunce. Tento namodralý ledový obr má mimořádně dynamickou atmosféru, v níž zuří bouře a byly naměřeny nejsilnější větry ve Sluneční soustavě.<br><br><b>Vzdálenost od Slunce:</b> V průměru 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů. Sluneční světlo k němu putuje zhruba čtyři hodiny.<br><br><b>Oběžná doba:</b> Jeden neptunský rok trvá přibližně 165 pozemských let. Neptun byl objeven v roce 1846 a první celý oběh od svého objevu dokončil v roce 2011.<br><br><b>Velikost:</b> Průměr přibližně 49 500 km, tedy asi 3,9násobek průměru Země. Je nejmenším ze čtyř obřích planet, ale má vyšší hustotu než Uran, a proto je o něco hmotnější.<br><br><b>Složení:</b> Neptun patří mezi ledové obry. Jeho nitro pravděpodobně tvoří látky jako voda, amoniak a metan obklopující kamenné jádro, nad nimiž leží atmosféra z vodíku a helia. Modré zbarvení souvisí s metanem, který pohlcuje červené světlo.<br><br><b>Pozoruhodné vlastnosti:</b> Sonda Voyager 2 pozorovala v roce 1989 Velkou tmavou skvrnu, bouřkový útvar rozměry srovnatelný se Zemí, který do roku 1994 zanikl. Od té doby byly pozorovány další tmavé bouře. Rychlost větru může dosahovat až 2 100 km/h, což patří k nejvyšším naměřeným hodnotám ve Sluneční soustavě. Jeho největší měsíc Triton obíhá proti směru rotace planety a téměř jistě jde o objekt zachycený z Kuiperova pásu.<br><br><a href='https://cs.wikipedia.org/wiki/Neptun' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="uranus" data-title="Uran" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/6/69/Uranus_Voyager2_color_calibrated.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Sedmá planeta od Slunce a jeden z ledových obrů. Nejpozoruhodnější je mimořádným sklonem rotační osy: vzhledem ke své oběžné dráze se otáčí téměř „naležato“.<br><br><b>Vzdálenost od Slunce:</b> V průměru 19,19 astronomické jednotky, přibližně 2,87 miliardy kilometrů. Sluneční světlo k němu putuje asi dvě hodiny a čtyřicet minut.<br><br><b>Oběžná doba:</b> Jeden uranský rok trvá přibližně 84 pozemských let. Osa rotace je skloněna o 97,77°, takže každý pól prožívá přibližně 42 let nepřetržitého slunečního svitu a poté 42 let tmy.<br><br><b>Velikost:</b> Průměr asi 50 700 km, což je přibližně čtyřnásobek průměru Země. Uran má větší objem než Neptun, ale nižší hmotnost, a je proto po Saturnu druhou nejméně hustou planetou Sluneční soustavy.<br><br><b>Složení:</b> Podobně jako Neptun se řadí mezi ledové obry. Pod atmosférou z vodíku a helia s příměsí metanu se pravděpodobně nachází vrstva látek, jako jsou voda, amoniak a metan, obklopující kamenné jádro. Metan dodává Uranu světle modrozelenou barvu, při srovnatelném zpracování snímků překvapivě podobnou barvě Neptunu.<br><br><b>Pozoruhodné vlastnosti:</b> Uran má soustavu 13 známých prstenců, které jsou na běžných optických snímcích téměř neviditelné, a 29 známých měsíců podle údajů ze srpna 2026. Většina je pojmenována podle postav z děl Williama Shakespeara a Alexandra Popea. Výrazný sklon rotační osy mohl způsobit mohutný náraz v rané historii Sluneční soustavy.<br><br><a href='https://cs.wikipedia.org/wiki/Uran' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="saturn" data-title="Saturn" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/Saturn_Storm.jpg/960px-Saturn_Storm.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Šestá planeta od Slunce a druhá největší planeta Sluneční soustavy. Tento plynný obr je proslulý především nádhernou a snadno pozorovatelnou soustavou prstenců, nejrozsáhlejší ze všech planet.<br><br><b>Vzdálenost od Slunce:</b> V průměru 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů. Sluneční světlo k Saturnu putuje něco přes hodinu.<br><br><b>Oběžná doba:</b> Jeden saturnský rok trvá přibližně 29,5 pozemského roku. Sklon rotační osy přibližně 26,7° způsobuje střídání ročních období. Prstence se ze Země jeví pod různými úhly podle toho, kde se Saturn právě nachází na své oběžné dráze.<br><br><b>Velikost:</b> Průměr přibližně 116 460 km, tedy asi 9,5násobek průměru Země. Navzdory ohromné velikosti má Saturn nejnižší průměrnou hustotu ze všech planet, dokonce nižší než voda. V dostatečně velkém oceánu by tedy teoreticky plaval.<br><br><b>Složení:</b> Plynný obr bez pevného povrchu, tvořený hlavně vodíkem a heliem, pravděpodobně s kamenným jádrem. Jeho jemně zlatavé zbarvení způsobují mimo jiné krystalky amoniaku ve svrchních vrstvách atmosféry.<br><br><b>Pozoruhodné vlastnosti:</b> Saturnovy prstence mají vnější průměr až kolem 282 000 km, většinou jsou však tenčí než jeden kilometr. Tvoří je převážně ledové částice a kamenná drť. Měsíc Titan je jedinou družicí Sluneční soustavy s hustou atmosférou. Enceladus zase z oblasti jižního pólu vyvrhuje gejzíry vodního ledu, a patří tak mezi nejslibnější kandidáty pro hledání mimozemského života.<br><br><a href='https://cs.wikipedia.org/wiki/Saturn' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="jupiter" data-title="Jupiter" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jupiter_OPAL_2024.png/960px-Jupiter_OPAL_2024.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Pátá planeta od Slunce a zdaleka největší planeta Sluneční soustavy. Tento plynný obr je natolik hmotný, že jeho gravitační vliv zasahuje celou Sluneční soustavu a některé komety odklání od vnitřních planet, zatímco jiná tělesa může naopak nasměrovat do jejich blízkosti.<br><br><b>Vzdálenost od Slunce:</b> V průměru 5,20 astronomické jednotky, přibližně 778 milionů kilometrů. Sluneční světlo k Jupiteru putuje asi 43 minut.<br><br><b>Oběžná doba:</b> Jeden jupiterovský rok trvá přibližně 11,86 pozemského roku. Přes svou obrovskou velikost se Jupiter otáčí rychleji než kterákoli jiná planeta: jednu otočku dokončí za méně než 10 hodin. Rychlá rotace způsobuje zřetelné zploštění planety na pólech.<br><br><b>Velikost:</b> Průměr asi 139 820 km, tedy přibližně jedenáctinásobek průměru Země. Jeho hmotnost více než dvakrát převyšuje součet hmotností všech ostatních planet. Přesto není dost hmotný na to, aby se v jeho nitru rozběhla trvalá jaderná fúze a stal se hvězdou.<br><br><b>Složení:</b> Plynný obr bez pevného povrchu, tvořený hlavně vodíkem a heliem. V hlubších vrstvách se pravděpodobně nachází kovový vodík, zvláštní forma vodíku schopná vést elektrický proud. Podílí se na vzniku Jupiterova mimořádně silného magnetického pole, nejsilnějšího mezi planetami Sluneční soustavy.<br><br><b>Pozoruhodné vlastnosti:</b> Velká rudá skvrna je obrovská bouře přetrvávající nejméně 350 let, i když se v posledních desetiletích zmenšuje. Jupiter měl v roce 2026 celkem 115 oficiálně uznaných měsíců. Čtyři z nich – Io, Europu, Ganymed a Callisto – pozoroval Galileo Galilei již v roce 1610. Europa patří mezi nejperspektivnější místa pro hledání mimozemského života díky pravděpodobnému oceánu kapalné vody pod ledovým povrchem.<br><br><a href='https://cs.wikipedia.org/wiki/Jupiter' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="asteroid-belt" data-title="Pás planetek" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/8/89/243_ida_crop.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Oblast Sluneční soustavy mezi drahami Marsu a Jupiteru, kde se nachází velké množství nepravidelných kamenných a kovových těles. Jde o pozůstatky rané Sluneční soustavy, které se mimo jiné vlivem Jupiterovy gravitace nespojily do jediné planety.<br><br><b>Vzdálenost od Slunce:</b> Pás se rozprostírá přibližně mezi 2,2 a 3,2 astronomické jednotky, tedy asi 329 až 479 milionů kilometrů od Slunce. Navzdory oblíbeným filmovým představám je převážně prázdným prostorem. Kosmické sondy jím prolétají bez větších obtíží.<br><br><b>Rozměry a hmotnost:</b> Odhaduje se, že obsahuje 1,1 až 1,9 milionu planetek s průměrem větším než 1 km. Celková hmotnost pásu však dosahuje jen asi 4 % hmotnosti Měsíce. Je tedy příliš malá na to, aby z ní vznikla planeta, a to i bez Jupiterova gravitačního působení.<br><br><b>Složení:</b> Planetky se složením značně liší. Ve vnitřní části pásu převládají kamenná tělesa tvořená křemičitany, ve vnější části jsou častější tmavší objekty bohaté na uhlík. Vyskytují se také železoniklové planetky, které mohou být pozůstatky jader rozbitých protoplanet. Ceres, jediná trpasličí planeta v pásu, obsahuje značné množství ledu a může mít velmi řídkou atmosféru z vodní páry.<br><br><b>Významné objekty:</b> Na samotnou Ceres připadá přibližně 30 % celkové hmotnosti pásu. Vesta je nejjasnější planetkou pozorovatelnou ze Země a vykazuje známky rozvrstveného nitra: podobně jako planeta si vytvořila jádro, plášť a kůru. Obě tělesa navštívila sonda NASA Dawn.<br><br><b>Úloha ve Sluneční soustavě:</b> Pás planetek je zdrojem meteoritů, které pravidelně dopadají na Zemi. Vědcům tak poskytuje přímé vzorky materiálu z rané Sluneční soustavy. Některé blízkozemní planetky pravděpodobně pocházejí právě odsud; jejich dráhy postupně změnily gravitační interakce, mimo jiné s Jupiterem.<br><br><a href='https://cs.wikipedia.org/wiki/Hlavn%C3%AD_p%C3%A1s' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="mars" data-title="Mars" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png/960px-Mars_-_August_30_2021_-_Flickr_-_Kevin_M._Gill.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Čtvrtá planeta od Slunce a nejvzdálenější ze čtyř kamenných planet. Chladný a suchý svět bohatý na oxidy železa, na němž se nachází nejvyšší sopka a nejdelší soustava kaňonů ve Sluneční soustavě.<br><br><b>Vzdálenost od Slunce:</b> V průměru obíhá ve vzdálenosti 1,52 astronomické jednotky, tedy asi 228 milionů kilometrů. Jeho výrazně eliptická dráha způsobuje, že množství dopadající sluneční energie se mezi přísluním a odsluním značně liší.<br><br><b>Oběžná doba:</b> Jeden marsovský rok trvá asi 687 pozemských dní. Sklon rotační osy 25,2° je podobný zemským 23,5°, takže i na Marsu se střídají roční období. Každé však trvá přibližně dvakrát déle než na Zemi.<br><br><b>Velikost:</b> Průměr přibližně 6 779 km, tedy asi polovina průměru Země. Povrchová gravitace dosahuje jen zhruba 38 % zemské hodnoty, a planeta proto nedokázala v průběhu geologického času udržet hustou atmosféru.<br><br><b>Složení:</b> Kamenná planeta s řídkou atmosférou tvořenou převážně oxidem uhličitým. Povrch pokrývá prach bohatý na oxidy železa, které mu dávají charakteristickou červenou barvu. Stopy dávných říčních údolí, jezerních pánví a polární čepičky z vodního ledu a zmrzlého oxidu uhličitého svědčí o výrazně odlišném klimatu v minulosti.<br><br><b>Pozoruhodné vlastnosti:</b> Olympus Mons, vysoký přibližně 21,9 km, je nejvyšší známou sopkou ve Sluneční soustavě. Údolní systém Valles Marineris se táhne přibližně 4 000 km, tedy téměř přes celou šířku Spojených států. Mars zkoumá několik robotických misí, včetně vozítka NASA Perseverance, které pátrá po stopách dávného mikrobiálního života.<br><br><a href='https://cs.wikipedia.org/wiki/Mars' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="earth" data-title="Země" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Meteosat-12-fci-march-equinox-2025-noon_%28cropped%29.jpg/960px-Meteosat-12-fci-march-equinox-2025-noon_%28cropped%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Třetí planeta od Slunce a největší ze čtyř kamenných planet. Je to jediné dosud známé těleso ve vesmíru, na němž byl potvrzen život, a současně cíl vaší antropologické výsadkové mise, člene posádky.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 1 astronomická jednotka, přibližně 150 milionů kilometrů. Tato vzdálenost historicky sloužila jako základ definice astronomické jednotky. Slunečnímu světlu trvá cesta k Zemi asi 8 minut a 20 sekund.<br><br><b>Oběžná doba:</b> Jeden rok trvá přibližně 365,25 dne. Zbylá čtvrtina dne je důvodem zavedení přestupných roků. Sklon zemské osy o přibližně 23,5° způsobuje střídání ročních období.<br><br><b>Velikost:</b> Průměr asi 12 742 km. Země je nejhustší planetou Sluneční soustavy. Její rozsáhlé železoniklové jádro vytváří globální magnetické pole, které pomáhá chránit atmosféru i život na povrchu před slunečním větrem.<br><br><b>Složení:</b> Kamenná planeta s rozlišenými vnitřními vrstvami: pevným vnitřním jádrem, kapalným vnějším jádrem, pláštěm a kůrou. Přibližně 71 % povrchu pokrývá kapalná voda, což je mezi známými planetami výjimečné. Atmosféru tvoří převážně dusík a kyslík a její složení zásadně ovlivnily miliardy let biologické činnosti.<br><br><b>Pozoruhodné vlastnosti:</b> Velký Měsíc pomáhá stabilizovat sklon zemské osy a tím i dlouhodobé klimatické poměry. Desková tektonika neustále přetváří zemskou kůru, ovlivňuje množství oxidu uhličitého v atmosféře a řídí geologickou činnost během 4,54 miliardy let historie planety. Země se nyní nachází v meziledové době a její dominantní druh, Homo sapiens, prokazatelně mění složení atmosféry a klima.<br><br><a href='https://cs.wikipedia.org/wiki/Zem%C4%9B' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="venus" data-title="Venuše" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/PIA23791-Venus-RealAndEnhancedContrastViews-20200608_%28cropped%29.jpg/960px-PIA23791-Venus-RealAndEnhancedContrastViews-20200608_%28cropped%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Druhá planeta od Slunce a velikostí nejpodobnější Zemi. Někdy se jí říká dvojče Země, její povrchové podmínky jsou však natolik extrémní, že toto přirovnání slouží spíše jako varování před důsledky atmosférických procesů.<br><br><b>Vzdálenost od Slunce:</b> V průměru obíhá ve vzdálenosti 0,72 astronomické jednotky, přibližně 108 milionů kilometrů. Přestože je ke Slunci blíže než Země, nejvyšší teplotu ze všech planet způsobuje především její atmosféra.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 225 pozemských dní. Venuše se však kolem své osy otáčí tak pomalu, že doba jedné otočky je delší než její rok. Navíc rotuje opačným směrem než většina planet, takže Slunce na Venuši vychází na západě a zapadá na východě.<br><br><b>Velikost:</b> Průměr asi 12 104 km, tedy přibližně 95 % průměru Země. Přes podobnou velikost nemá Venuše vlastní globální magnetické pole ani žádný měsíc. Tlak na jejím povrchu je zhruba 92krát vyšší než na Zemi, což odpovídá tlaku v hloubce přibližně 900 metrů pod vodou.<br><br><b>Složení:</b> Kamenná planeta s hustou atmosférou tvořenou téměř výhradně oxidem uhličitým a s oblaky kyseliny sírové. Skleníkový efekt je zde tak silný, že teplota povrchu dosahuje asi 465 °C, tedy dost na roztavení olova, a mezi denní a noční stranou se téměř nemění.<br><br><b>Pozoruhodné vlastnosti:</b> Venuše má více sopek než kterákoli jiná planeta a existují náznaky, že některé mohou být stále činné. Povrch ukrytý pod hustými oblaky zmapovala počátkem 90. let sonda NASA Magellan pomocí radaru. Odhalila rozsáhlé pláně, vyvýšené oblasti a obrovské vulkanické útvary.<br><br><a href='https://cs.wikipedia.org/wiki/Venu%C5%A1e' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="mercury" data-title="Merkur" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mercury_in_true_color.jpg/960px-Mercury_in_true_color.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>První planeta od Slunce a zároveň nejmenší planeta Sluneční soustavy. Je to kamenné těleso téměř bez atmosféry, hustě pokryté krátery, které obíhá blíže ke Slunci než kterákoli jiná planeta a zažívá mimořádně velké rozdíly mezi denními a nočními teplotami.<br><br><b>Vzdálenost od Slunce:</b> V průměru obíhá ve vzdálenosti 0,39 astronomické jednotky, tedy přibližně 58 milionů kilometrů. Jeho výrazně eliptická dráha však znamená, že vzdálenost kolísá zhruba mezi 46 a 70 miliony kilometrů.<br><br><b>Oběžná doba:</b> Jeden rok na Merkuru trvá pouze 88 pozemských dní. Kvůli pomalému otáčení kolem osy a rychlému oběhu však jeden sluneční den, tedy doba od jednoho východu Slunce k dalšímu, trvá přibližně 176 pozemských dní. Během jediného místního dne tak uplynou dva merkurovské roky.<br><br><b>Velikost:</b> Průměr přibližně 4 880 km, tedy jen o něco více než průměr pozemského Měsíce. Merkur je navzdory malé velikosti po Zemi druhou nejhustší planetou, což naznačuje neobvykle velké železné jádro zabírající až 85 % jeho poloměru.<br><br><b>Složení:</b> Kamenná planeta prakticky bez atmosféry, pouze s velmi řídkou exosférou tvořenou atomy uvolněnými z povrchu mimo jiné slunečním větrem. Bez atmosféry, která by rozváděla teplo, se povrch na osvětlené straně zahřívá asi na 430 °C a v noci ochlazuje přibližně na −180 °C.<br><br><b>Pozoruhodné vlastnosti:</b> Přes blízkost Slunce potvrdila radarová pozorování a údaje ze sondy NASA MESSENGER přítomnost vodního ledu v trvale zastíněných kráterech poblíž pólů. Pánev Caloris o průměru přibližně 1 550 km patří k největším impaktním strukturám ve Sluneční soustavě. Srážka, která ji vytvořila, byla tak mohutná, že narušila terén i na opačné straně planety.<br><br><a href='https://cs.wikipedia.org/wiki/Merkur_(planeta)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="sun" data-title="Slunce" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/960px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Hvězda ve středu Sluneční soustavy a zdroj slunečního záření, které ovlivňuje podnebí planet a mnoho biologických procesů. Geologickou činnost těles však často pohání také vnitřní teplo a slapové síly. Podle galaktických měřítek jde o hvězdu středního věku a střední velikosti, ačkoli z lidského pohledu je zcela mimořádná.<br><br><b>Vzdálenost od Země:</b> Přibližně 1 astronomická jednotka, tedy 149,6 milionu kilometrů. Světlu trvá překonání této vzdálenosti asi 8 minut a 20 sekund. Slunce je tak velké, že by se do jeho objemu vešlo přibližně 1,3 milionu Zemí.<br><br><b>Stáří a délka života:</b> Slunce je staré přibližně 4,6 miliardy let a nachází se zhruba v polovině své předpokládané desetimiliardové životní etapy na hlavní posloupnosti. Asi za 5 miliard let vyčerpá vodíkové palivo ve svém jádře, změní se v červeného obra a pravděpodobně pohltí některé vnitřní planety. Nakonec po odvržení vnějších vrstev zůstane bílý trpaslík.<br><br><b>Rozměry a hmotnost:</b> Průměr Slunce je přibližně 1,39 milionu kilometrů, tedy 109krát více než průměr Země. Připadá na něj 99,86 % hmotnosti celé Sluneční soustavy. Jeho gravitace působí daleko za Kuiperovým pásem, až do Oortova oblaku, a váže tělesa vzdálená až 100 000 astronomických jednotek.<br><br><b>Složení:</b> Hmotnost Slunce tvoří přibližně ze 73 % vodík a z 25 % helium, zbytek představují stopová množství těžších prvků. Teplota v jádru dosahuje asi 15 milionů °C. Při takových teplotách probíhá jaderná fúze, při níž se vodík mění na helium a uvolňuje energii pohánějící celou Sluneční soustavu.<br><br><b>Pozoruhodné vlastnosti:</b> Viditelný povrch Slunce, fotosféra, má teplotu přibližně 5 500 °C, zatímco vnější koróna dosahuje několika milionů stupňů. Příčiny tohoto překvapivého rozdílu nejsou dosud zcela objasněny. Slunce také nepřetržitě vysílá proud nabitých částic zvaný sluneční vítr. Ten ovlivňuje magnetická pole planet, vyvolává polární záře a postupně může odnášet atmosféru planet bez dostatečné ochrany, například Marsu.<br><br><a href='https://cs.wikipedia.org/wiki/Slunce' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="pluto" data-title="Pluto" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/ca/Pluto_in_True_Color_-_High-Res.png/960px-Pluto_in_True_Color_-_High-Res.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Trpasličí planeta v Kuiperově pásu, která byla až do svého přeřazení v roce 2006 považována za devátou planetu Sluneční soustavy. Tento malý ledový svět má překvapivě složitou geologii a velký měsíc <a href='https://cs.wikipedia.org/wiki/Charon_(m%C4%9Bs%C3%ADc)' target='_blank'>Charon</a>, s nímž tvoří soustavu připomínající dvojici trpasličích planet.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 39,48 astronomické jednotky, tedy asi 5,9 miliardy kilometrů. Výrazně eliptická dráha znamená, že se Pluto někdy dostává ke Slunci blíže než Neptun, jako tomu bylo v letech 1979 až 1999.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 248 pozemských let. Pluto se otočí kolem osy jednou za 6,4 pozemského dne. S Charonem je vzájemně slapově vázáno, takže obě tělesa k sobě trvale obracejí stejnou stranu.<br><br><b>Velikost:</b> Průměr přibližně 2 377 km, tedy asi 18 % průměru Země a zhruba dvě třetiny průměru Měsíce. Navzdory malé velikosti má Pluto pět známých měsíců: Charon, Styx, Nix, Kerberos a Hydra.<br><br><b>Složení:</b> Směs hornin a ledu s povrchem pokrytým zmrzlým dusíkem, metanem a oxidem uhelnatým. Uvnitř se pravděpodobně nachází kamenné jádro, možná obklopené podpovrchovým oceánem kapalné vody, což dosud nebylo potvrzeno. Řídká atmosféra tvořená převážně dusíkem s příměsí metanu a oxidu uhelnatého se sezónně mění výměnou plynů s povrchovým ledem. Zda může při vzdalování od Slunce zcela zkolabovat, zůstává nejisté.<br><br><b>Pozoruhodné vlastnosti:</b> Sonda NASA New Horizons proletěla kolem Pluta v červenci 2015 a odhalila geologicky rozmanitý svět s ledovými horami vysokými až 3 500 metrů, rozsáhlými pláněmi dusíkového ledu a nápadnou oblastí ve tvaru srdce nazvanou Tombaugh Regio podle objevitele Pluta. Změna jeho klasifikace v roce 2006 zůstává jedním z nejdiskutovanějších rozhodnutí Mezinárodní astronomické unie.<br><br><a href='https://cs.wikipedia.org/wiki/Pluto' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="eris" data-title="Eris" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/6/63/Eris_and_moon_Dysnomia_JWST_NIRCam.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Trpasličí planeta v oblasti rozptýleného disku za Kuiperovým pásem a nejhmotnější známá trpasličí planeta Sluneční soustavy. Její objev v roce 2005 přímo podnítil přehodnocení postavení Pluta a stanovení oficiální definice planety.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 67,8 astronomické jednotky, tedy přibližně 10,1 miliardy kilometrů. Na silně eliptické dráze se však vzdálenost mění zhruba mezi 38 a 97 astronomickými jednotkami. V nejvzdálenějším bodě je Eris téměř dvakrát dále od Slunce než Pluto.<br><br><b>Oběžná doba:</b> Jeden oběh trvá přibližně 559 pozemských let. Eris se nyní nachází poblíž odsluní, nejvzdálenějšího bodu své dráhy, a do přísluní se dostane až za několik století.<br><br><b>Velikost:</b> Průměr přibližně 2 326 km, tedy o něco méně než Pluto, ale hmotnost má přibližně o 27 % vyšší. Je tak nejhmotnější známou trpasličí planetou.<br><br><b>Složení:</b> Pozorování naznačují, že povrch pokrývá metanový led, který velmi dobře odráží světlo. Eris proto patří k objektům s nejvyšší odrazivostí ve Sluneční soustavě. Její nitro pravděpodobně tvoří směs hornin a ledu podobně jako u Pluta, ale protože ji dosud nenavštívila žádná sonda, víme o ní podstatně méně.<br><br><b>Pozoruhodné vlastnosti:</b> Objevitelé Eris zprvu neoficiálně přezdívali Xena. Později získala jméno řecké bohyně sváru, což vzhledem k vyvolané astronomické kontroverzi působí příznačně. Její objev přiměl Mezinárodní astronomickou unii nově vymezit pojem planeta a v roce 2006 přeřadit Pluto mezi trpasličí planety. Její měsíc <a href='https://cs.wikipedia.org/wiki/Dysnomia_(m%C4%9Bs%C3%ADc)' target='_blank'>Dysnomia</a> je pojmenován po řecké bohyni nezákonnosti, dceři Eris. Jeho průměr se odhaduje asi na 700 km a jeden oběh kolem Eris trvá 15,8 dne. Dvojice jmen Eris a Dysnomia představuje pozoruhodně sourodé astronomické pojmenování.<br><br><a href='https://cs.wikipedia.org/wiki/Eris_(trpasli%C4%8D%C3%AD_planeta)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="makemake" data-title="Makemake" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/2/29/Makemake_and_its_moon.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Trpasličí planeta v Kuiperově pásu, která patří mezi největší známá tělesa vnější Sluneční soustavy. Nese jméno stvořitelského božstva původních obyvatel Rapa Nui na Velikonočním ostrově. Objevena byla v roce 2005 a za trpasličí planetu oficiálně uznána v roce 2008.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 45,8 astronomické jednotky, tedy asi 6,85 miliardy kilometrů. Její dráha je méně protáhlá než u Eris či Pluta, takže se většinou pohybuje v oblasti klasického Kuiperova pásu.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 305 pozemských let. Kolem vlastní osy se Makemake otočí jednou za 22,5 hodiny, což se od délky pozemského dne příliš neliší.<br><br><b>Velikost:</b> Průměr přibližně 1 430 km, tedy asi 60 % průměru Pluta. Makemake patří mezi největší známé objekty Kuiperova pásu. Má jeden známý měsíc s prozatímním označením S/2015 (136472) 1 a neoficiální přezdívkou MK2, objevený v roce 2016.<br><br><b>Složení:</b> Povrch pokrývá zmrzlý metan, etan a pravděpodobně také dusík, které mu propůjčují červenohnědý odstín. Stejně jako Eris má vysokou odrazivost. Makemake zřejmě nemá významnější atmosféru, nanejvýš velmi řídkou a přechodnou, která může vznikat v období největšího přiblížení ke Slunci.<br><br><b>Pozoruhodné vlastnosti:</b> Objev měsíce <a href='https://cs.wikipedia.org/w/index.php?search=S%2F2015%20(136472)%201%20Makemake&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>MK2</a> je důležitý, protože zkoumání jeho oběžné dráhy by mohlo umožnit určit hmotnost Makemake. Měsíc je výrazně tmavší než samotná trpasličí planeta, což naznačuje rozdílné složení povrchu. Vzhledem k menší velikosti a slabší gravitaci mohl například postupně ztratit těkavé ledové látky.<br><br><a href='https://cs.wikipedia.org/wiki/Makemake' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="haumea" data-title="Haumea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/2/2b/Haumea_Hubble.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Trpasličí planeta v Kuiperově pásu a jedno z nejpodivuhodnějších těles vnější Sluneční soustavy. Otáčí se tak rychle, že získala výrazně protáhlý elipsoidní tvar připomínající spíše zploštělý ragbyový míč než kouli.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 43,1 astronomické jednotky, přibližně 6,45 miliardy kilometrů. Její středně protáhlá dráha ji po většinu oběhu udržuje v klasickém Kuiperově pásu.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá asi 284 pozemských let. Ještě nápadnější je ovšem rotace kolem osy: jednu otočku Haumea dokončí přibližně za 3,9 hodiny, nejrychleji ze všech známých velkých těles Sluneční soustavy. Právě tato rychlost je hlavní příčinou jejího neobvyklého tvaru.<br><br><b>Velikost:</b> Vzhledem k protáhlému tvaru nelze její velikost vystihnout jediným průměrem. Podél nejdelší osy měří přibližně 2 100 km, podél nejkratší asi 1 000 km. Má dva známé měsíce, <a href='https://cs.wikipedia.org/w/index.php?search=Hi%CA%BBiaka%20m%C4%9Bs%C3%ADc%20Haumea&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Hi'iaka</a> a <a href='https://cs.wikipedia.org/w/index.php?search=Namaka%20m%C4%9Bs%C3%ADc%20Haumea&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Namaka</a>, pojmenované po havajských bohyních spojených s Haumeou, bohyní plodnosti a porodu.<br><br><b>Složení:</b> Na rozdíl od mnoha jiných objektů Kuiperova pásu je její povrch zřejmě tvořen téměř čistým krystalickým vodním ledem, díky čemuž je velmi světlý. Vnitřek je patrně kamenný a ledová slupka relativně tenká. Haumea má také slabý prstenec objevený v roce 2017.<br><br><b>Pozoruhodné vlastnosti:</b> Haumea je pravděpodobně největším pozůstatkem katastrofické srážky, k níž došlo před miliardami let. Její dva měsíce a skupina menších objektů Kuiperova pásu mají podobné složení a zřejmě představují úlomky vzniklé při téže dávné události.<br><br><a href='https://cs.wikipedia.org/wiki/Haumea' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="quaoar" data-title="Quaoar" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/a/a2/Quaoar_as_taken_by_NIRCam.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Středně velké těleso Kuiperova pásu a pravděpodobná trpasličí planeta, pojmenovaná po stvořitelském božstvu kalifornského domorodého národa Tongva. V posledních letech vzbudila pozornost především prstencem, jehož poloha odporuje dosavadním představám o vzniku a stabilitě planetárních prstenců.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 43,4 astronomické jednotky, asi 6,49 miliardy kilometrů. Ve srovnání s mnoha objekty Kuiperova pásu je její dráha poměrně málo protáhlá, a proto zůstává v klasickém pásu po celý oběh.<br><br><b>Oběžná doba:</b> Jeden oběh trvá přibližně 288 pozemských let. Kolem vlastní osy se Quaoar otočí za 8,8 hodiny, což není v porovnání s extrémně rychlou rotací Haumey nijak neobvyklé.<br><br><b>Velikost:</b> Průměr asi 1 090 km, přibližně polovina průměru Pluta. Má jeden známý měsíc, <a href='https://cs.wikipedia.org/w/index.php?search=Weywot%20m%C4%9Bs%C3%ADc%20Quaoar&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Weywot</a>, pojmenovaný po bohu oblohy a synovi Quaoara v mytologii Tongvů. Obíhá ve vzdálenosti zhruba 14 500 km a jeden oběh dokončí přibližně za 12,4 dne.<br><br><b>Složení:</b> Pozorování povrchu naznačují směs vodního ledu a hornin s možnými stopami hydratovaného amoniaku. Hustota se zdá vyšší než u mnoha dalších objektů Kuiperova pásu, což by mohlo ukazovat na větší podíl hornin v nitru. Povrch také vykazuje známky dávné geologické nebo kryovulkanické činnosti.<br><br><b>Pozoruhodné vlastnosti:</b> Pozorování v roce 2023 potvrdila existenci prstence ve vzdálenosti výrazně přesahující hranici, kterou by předpokládal klasický výklad Rocheovy meze, tedy vzdálenosti, v níž slapové síly obvykle brání vzniku většího měsíce. Objev zpochybnil stávající modely prstenců a naznačil, že ledové částice mohou být příliš pevné na to, aby se spojily v měsíc, a proto zůstávají v podobě prstence.<br><br><a href='https://cs.wikipedia.org/wiki/Quaoar' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="orcus" data-title="Orcus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/4/4b/Orcus-Vanth_orbit.gif' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Kandidát na trpasličí planetu v Kuiperově pásu, někdy nazývaný „anti-Pluto“. Obíhá po dráze nápadně podobné dráze Pluta, avšak nachází se v jiné části své oběžné dráhy. Obě tělesa sdílejí také některé fyzikální vlastnosti, a proto jsou často srovnávána.<br><br><b>Vzdálenost od Slunce:</b> Průměrně 39,2 astronomické jednotky, tedy přibližně 5,87 miliardy kilometrů. Jeho skloněná a eliptická dráha připomíná dráhu Pluta a vzdálenost od Slunce se mění zhruba mezi 30 a 48 astronomickými jednotkami.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 245 pozemských let, podobně jako 248 let u Pluta. Obě tělesa jsou s Neptunem v orbitální rezonanci 2 : 3: zatímco Neptun vykoná tři oběhy, Orcus či Pluto vykonají dva.<br><br><b>Velikost:</b> Průměr asi 910 km, takže patří mezi větší objekty Kuiperova pásu, přesto je výrazně menší než Pluto. Má jeden známý měsíc, <a href='https://cs.wikipedia.org/w/index.php?search=Vanth%20m%C4%9Bs%C3%ADc%20Orcus&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Vanth</a>, jehož průměr může dosahovat asi poloviny průměru Orca. Měsíc nese jméno etruské okřídlené bytosti provázející duše do podsvětí. Orcus je zase římský bůh podsvětí a trestatel porušení přísah.<br><br><b>Složení:</b> Spektrální pozorování naznačují přítomnost vodního ledu a možná také hydrátů amoniaku na poměrně tmavém, barevně neutrálním povrchu. Amoniakový led je zajímavý tím, že ho záření postupně rozkládá. Jeho přítomnost by proto mohla ukazovat na relativně nedávnou kryovulkanickou aktivitu, která jej doplňuje.<br><br><b>Pozoruhodné vlastnosti:</b> Soustava Orcus–Vanth vyniká poměrně velkým měsícem vzhledem k hlavnímu tělesu, podobně jako soustava Pluto–Charon. Někteří astronomové proto uvažují spíše o dvojici trpasličích planet. Orcus dosud nenavštívila žádná kosmická sonda a většina poznatků pochází z pozemních pozorování a Hubbleova vesmírného dalekohledu.<br><br><a href='https://cs.wikipedia.org/wiki/Orcus_(planetka)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="sedna" data-title="Sedna" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/0/02/Sedna_PRC2004-14d.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Vzdálené transneptunické těleso s jednou z nejprotáhlejších drah mezi známými velkými objekty Sluneční soustavy. Po většinu oběhu je tak daleko od Slunce, že se nachází ve špatně prozkoumané oblasti mezi Kuiperovým pásem a hypotetickým Oortovým oblakem. Tento svět vyvolává více otázek, než na kolik zatím známe odpovědi.<br><br><b>Vzdálenost od Slunce:</b> V přísluní se nachází přibližně 76 astronomických jednotek od Slunce, v odsluní až 937 jednotek, tedy zhruba 140 miliard kilometrů. Nyní se přibližuje k přísluní, kterého dosáhne kolem roku 2076. Patří k nemnoha velkým tělesům pozorovatelným ze Země na tak extrémní vzdálenosti.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 11 000 pozemských let. Po převážnou většinu této doby je Sedna tak daleko od Slunce, že teplota na jejím povrchu zůstává blízko −240 °C, tedy jen asi 33 stupňů nad absolutní nulou.<br><br><b>Velikost:</b> Odhadovaný průměr přibližně 995 km, ale kvůli obrovské vzdálenosti se odhady liší. Zatím nebyl potvrzen žádný měsíc, což je u tělesa této velikosti poněkud neobvyklé a stále to přitahuje pozornost astronomů.<br><br><b>Složení:</b> Povrch zřejmě pokrývá směs vodního, metanového a dusíkového ledu spolu s tholiny, složitými organickými látkami vznikajícími působením záření na jednodušší molekuly. Díky nim patří Sedna mezi nejčervenější objekty Sluneční soustavy po Marsu.<br><br><b>Pozoruhodné vlastnosti:</b> Extrémní dráhu Sedny nedokážou dosavadní modely vzniku Sluneční soustavy uspokojivě vysvětlit. Mezi hlavní hypotézy patří blízký průlet jiné hvězdy v rané historii soustavy, gravitační vliv hypotetické deváté planety nebo dokonce zachycení Sedny z jiné hvězdné soustavy. Její existence představuje jeden z důležitých argumentů v pokračujícím pátrání po deváté planetě.<br><br><a href='https://cs.wikipedia.org/wiki/Sedna_(planetka)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="triton" data-title="Triton" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/98/Triton-usgs23-with-frame.jpg/960px-Triton-usgs23-with-frame.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Největší měsíc Neptunu a jedno z geologicky nejaktivnějších těles vnější Sluneční soustavy. Mezi velkými měsíci je výjimečný tím, že obíhá proti směru rotace své planety, což silně naznačuje, že byl zachycen z Kuiperova pásu a nevznikl společně s Neptunem.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 354 759 km a jeden oběh dokončí za 5,88 pozemského dne. Jeho retrográdní dráha se vlivem slapových sil postupně zmenšuje. Přibližně za 3,6 miliardy let by Triton mohl překročit Rocheovu mez a rozpadnout se v soustavu prstenců.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, tedy asi 4,5 miliardy kilometrů od Slunce.<br><br><b>Velikost:</b> Průměr přibližně 2 707 km. Je sedmým největším měsícem Sluneční soustavy a větším tělesem než Pluto. Jeho gravitace jej vytvarovala do přibližně kulového tvaru.<br><br><b>Složení:</b> Povrch Tritonu pokrývá dusíkový led a suchý led, tedy zmrzlý oxid uhličitý. Má řídkou dusíkovou atmosféru. Jeho nitro pravděpodobně tvoří kamenné jádro obklopené ledovým pláštěm. Uvažuje se také o možném podpovrchovém oceánu kapalné vody, který by mohlo udržovat slapové zahřívání.<br><br><b>Pozoruhodné vlastnosti:</b> Při průletu sondy Voyager 2 v roce 1989 byly na Tritonu objeveny aktivní gejzíry vyvrhující tmavé chocholy dusíkového plynu a prachu několik kilometrů vysoko. V řídké atmosféře je pak odnáší vítr. Teplota povrchu kolem −235 °C patří mezi nejnižší přímo naměřené ve Sluneční soustavě. Zachycení Tritonu pravděpodobně narušilo dráhy původních Neptunových měsíců a zásadně ovlivnilo podobu celé soustavy.<br><br><a href='https://cs.wikipedia.org/wiki/Triton_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="proteus" data-title="Proteus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/8/83/Proteus_%28Voyager_2%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Druhý největší měsíc Neptunu a největší z jeho vnitřních družic. Toto tmavé, nepravidelně tvarované těleso bylo objeveno až při průletu Voyageru 2 v roce 1989. Navzdory velikosti unikalo pozemským pozorováním, protože obíhá velmi blízko planety a odráží jen málo světla.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 117 647 km a jeden oběh dokončí za 1,12 pozemského dne. Je slapově vázán na Neptun.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, tedy přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 420 km. Proteus je nepravidelný a možná se blíží největší velikosti, při níž se těleso ještě nemusí vlastní gravitací zaoblit do koule.<br><br><b>Složení:</b> O vnitřním složení se ví velmi málo. Mimořádně tmavý povrch odráží pouze asi 10 % dopadajícího světla, je silně pokryt krátery a nevykazuje známky geologické činnosti. Pravděpodobně jej tvoří vodní led smíšený s horninami a tmavými organickými látkami.<br><br><b>Pozoruhodné vlastnosti:</b> Nejvýraznějším útvarem je impaktní kráter Pharos o průměru přibližně 255 km, obrovský vzhledem k velikosti měsíce. To, že Proteus náraz přežil bez úplného roztříštění, naznačuje určitou vnitřní soudržnost. Vzhledem k narušení původní soustavy měsíců při zachycení Tritonu může být Proteus pozůstatkem nebo znovu spojeným úlomkem této dávné události.<br><br><a href='https://cs.wikipedia.org/wiki/Proteus_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="nereid" data-title="Nereida" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/b/b0/Nereid-Voyager2.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Třetí největší měsíc Neptunu a jedna z družic s nejneobvyklejšími drahami ve Sluneční soustavě. Pohybuje se po mimořádně protáhlé elipse, pravděpodobně v důsledku gravitačních poruch vyvolaných zachycením Tritonu před miliardami let.<br><br><b>Vzdálenost od Neptunu:</b> Její silně eliptická dráha sahá od přibližně 1,4 milionu kilometrů při největším přiblížení až po více než 9,6 milionu kilometrů v nejvzdálenějším bodě. Patří k nejvýrazněji protáhlým drahám známých měsíců. Jeden oběh trvá asi 360 pozemských dní, tedy téměř pozemský rok.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr asi 340 km. Je příliš malá na to, aby se vlastní gravitací vytvarovala do koule. Její jasnost se v krátkých intervalech výrazně mění, možná kvůli nepravidelnému tvaru a rotaci nebo oblastem s rozdílnou odrazivostí.<br><br><b>Složení:</b> Přesné složení není známo. Povrchová pozorování naznačují vodní led smíšený s tmavým materiálem a celkově nízkou odrazivost. Příčina neobvyklých změn jasnosti dosud není uspokojivě vysvětlena.<br><br><b>Pozoruhodné vlastnosti:</b> Nereidu objevil roku 1949 Gerard Kuiper, po němž je pojmenován Kuiperův pás. Byla druhým objeveným měsícem Neptunu po Tritonu. Voyager 2 kolem ní v roce 1989 proletěl příliš daleko na získání podrobných snímků, a proto zůstává jednou z nejméně prozkoumaných družic vnějších planet. Její neobvyklá dráha může souviset s gravitačními změnami po zachycení Tritonu, skutečný původ Nereidy však zůstává předmětem výzkumu.<br><br><a href='https://cs.wikipedia.org/wiki/Nereida_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="larissa" data-title="Larissa" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/5/5b/Larissa_1.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý nepravidelný vnitřní měsíc Neptunu s povrchem posetým krátery. Obíhá tak blízko planety, že jeden oběh dokončí za méně než pozemský den. Možná patří mezi pozůstatky nebo znovu spojené úlomky z doby, kdy zachycení Tritonu narušilo původní soustavu měsíců.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 73 548 km a jeden oběh trvá 0,555 pozemského dne, tedy něco přes 13 hodin. K Neptunu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 194 km. Její protáhlý nepravidelný tvar má rozměry zhruba 216 × 204 × 168 km. Vlastní gravitace ji nedokáže vytvarovat do koule.<br><br><b>Složení:</b> Přesné složení téměř neznáme. Podobně jako jiné vnitřní měsíce Neptunu ji pravděpodobně tvoří vodní led, horniny a tmavé organické látky. Silně pokrytý krátery a zdánlivě geologicky nečinný povrch uchovává stopy dopadů za miliardy let.<br><br><b>Pozoruhodné vlastnosti:</b> Larissa byla poprvé předběžně zaznamenána v roce 1981 při zákrytu vzdálené hvězdy, ale potvrzena až během průletu Voyageru 2 v roce 1989. Stejně jako některé další vnitřní měsíce se kvůli slapovým silám postupně přibližuje k Neptunu. Ve vzdálené budoucnosti může dopadnout na planetu nebo se rozpadnout na prstenec.<br><br><a href='https://cs.wikipedia.org/wiki/Larissa_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="galatea" data-title="Galatea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/d/d8/Galatea_moon.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý vnitřní měsíc Neptunu obíhající uvnitř jeho prstencové soustavy. Pozoruhodný je především gravitačním působením na Adamsův prstenec, nejvzdálenější a nejvýraznější prstenec planety.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 61 953 km a jeden oběh dokončí za 0,429 pozemského dne, tedy něco přes 10 hodin. Pohybuje se těsně uvnitř Adamsova prstence a svou gravitací pomáhá udržovat jeho oblouky.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 176 km. Její tvar je nepravidelný a gravitace je příliš slabá na vznik koule. Stejně jako jiné vnitřní měsíce je slapově vázána na Neptun.<br><br><b>Složení:</b> Pro nedostatek pozorování je špatně prozkoumané. Povrchové vlastnosti naznačují tmavý vodní led smíšený s horninami a organickými látkami. Nebyla zjištěna geologická aktivita a povrch je patrně silně pokryt krátery.<br><br><b>Pozoruhodné vlastnosti:</b> Hlavní význam Galatey spočívá v jejím gravitačním působení. Orbitální rezonance s Adamsovým prstencem zřejmě pomáhá udržovat materiál v oddělených obloucích, které pozoroval Voyager 2 v roce 1989, místo aby se rovnoměrně rozprostřel po celé dráze. Galatea byla objevena během téhož průletu a žádná další sonda ji dosud nenavštívila.<br><br><a href='https://cs.wikipedia.org/wiki/Galatea_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="despina" data-title="Despina" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/5/5f/Despina.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý vnitřní měsíc Neptunu, který patří k nejbližším družicím planety. Svou gravitací pomáhá udržovat prstenec Le Verrier. Stejně jako jiné nepravidelné vnitřní měsíce mohl vzniknout z úlomků po narušení původní soustavy zachycením Tritonu.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 52 526 km a jeden oběh trvá 0,335 pozemského dne, tedy něco přes 8 hodin. Pohybuje se v těsné blízkosti prstence Le Verrier a gravitačně ovlivňuje jeho vnitřní okraj.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 150 km. Nepravidelné těleso měří asi 180 × 148 × 128 km. Je slapově vázáno a příliš malé na to, aby vlastní gravitací získalo kulový tvar.<br><br><b>Složení:</b> Přesné údaje chybějí. Předpokládá se směs vodního ledu, hornin a tmavých organických sloučenin, podobně jako u sousedních měsíců. Nebyly zjištěny známky geologické činnosti.<br><br><b>Pozoruhodné vlastnosti:</b> Despinu objevil Voyager 2 v roce 1989. Jméno dostala po dceři Poseidona a Démétér z řecké mytologie. Její gravitační působení na prstenec Le Verrier připomíná úlohu Galatey u Adamsova prstence. Naznačuje, že Neptunovy prstence nejsou statické útvary, ale jejich tvar pomáhají dlouhodobě udržovat malé družice.<br><br><a href='https://cs.wikipedia.org/wiki/Despina_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="thalassa" data-title="Thalassa" data-desc="<br>Malý tmavý měsíc Neptunu, jeden z nejvnitřnějších v celé soustavě. Má nepravidelný tvar a obíhá poblíž planetárních prstenců. Může být znovu spojeným úlomkem z období bouřlivých změn po zachycení Tritonu.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 50 074 km a jeden oběh dokončí za 0,311 pozemského dne, tedy přibližně 7,5 hodiny. Pohybuje se těsně za prstencem Galle, nejvnitřnějším ze známých Neptunových prstenců.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 108 km. Výrazně zploštělé těleso má rozměry asi 108 × 100 × 52 km. Je slapově vázáno na Neptun, ale vlastní gravitace nestačí k vytvoření koule.<br><br><b>Složení:</b> Podobně jako u okolních měsíců se předpokládá směs vodního ledu, hornin a tmavých organických látek. Povrch je patrně silně pokrytý krátery a geologicky neaktivní, ačkoli podrobné údaje chybějí.<br><br><b>Pozoruhodné vlastnosti:</b> Thalassu objevil Voyager 2 v roce 1989 a dostala jméno řecké bohyně moře, dcery Aithéra a Hémery. Neobvykle zploštělý tvar ji odlišuje od sousedních měsíců a možná souvisí se způsobem, jakým se spojila z trosek po zachycení Tritonu. Její dráha se postupně zmenšuje a v daleké budoucnosti může být roztrhána slapovými silami nebo dopadnout na Neptun.<br><br><a href='https://cs.wikipedia.org/wiki/Thalassa_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="naiad" data-title="Naiad" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/f/f3/Naiad_Voyager.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejvnitřnější známý měsíc Neptunu a jedna z nejbližších družic k mateřské planetě ve Sluneční soustavě. Malé tmavé těleso s nepravidelným tvarem se pohybuje po neobyčejné skloněné dráze, která při pohledu vůči sousední Thalasse vytváří klikatý vzor.<br><br><b>Vzdálenost od Neptunu:</b> Obíhá v průměrné vzdálenosti 48 227 km a jeden oběh dokončí za 0,294 pozemského dne, tedy přibližně 7 hodin. Dráha je mírně skloněná a vzhledem k pohybu Thalassy vytváří zvláštní vzájemné proplétání, které brání těsným setkáním obou měsíců.<br><br><b>Vzdálenost od Slunce:</b> Jako měsíc Neptunu se nachází v průměrné vzdálenosti 30,07 astronomické jednotky, přibližně 4,5 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 96 km, takže jde o nejmenší z pojmenovaných vnitřních měsíců Neptunu. Je natolik malá, že její tvar určuje spíše pevnost materiálu než vlastní gravitace.<br><br><b>Složení:</b> Podrobné údaje chybějí. Předpokládá se tmavý vodní led smíšený s horninami a organickými látkami, podobně jako u dalších vnitřních měsíců. Povrch odráží velmi málo světla a nebyla na něm pozorována geologická činnost.<br><br><b>Pozoruhodné vlastnosti:</b> Naiad objevila sonda Voyager 2 v roce 1989. Neobvyklý pohyb se podařilo vysvětlit až později pomocí dat Hubbleova vesmírného dalekohledu. Naiad a Thalassa jsou v orbitální rezonanci: na každých 69 oběhů Thalassy připadá 73 oběhů Naiad. Díky tomu se při vzájemném přiblížení střídavě míjejí v různých vzdálenostech, aniž by se srazily.<br><br><a href='https://cs.wikipedia.org/wiki/Naiad_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="titania" data-title="Titania" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/f/f4/Titania_VGR2_C2684315.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Největší měsíc Uranu a jeden z nenápadně pozoruhodných světů vnější Sluneční soustavy. Jeho zmrzlý povrch posetý krátery utvářely dopady jiných těles i dávné vnitřní procesy.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 436 300 km a jeden oběh dokončí za 8,71 pozemského dne. Stejně jako většina velkých měsíců je slapově vázána a k Uranu obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást soustavy Uranu obíhá v průměrné vzdálenosti 19,2 astronomické jednotky, tedy přibližně 2,87 miliardy kilometrů od Slunce.<br><br><b>Velikost:</b> Průměr přibližně 1 578 km. Je osmým největším měsícem Sluneční soustavy a vlastní gravitace jí dala kulový tvar.<br><br><b>Složení:</b> Přibližně stejný podíl vodního ledu a hornin. Povrch je ztmavlý dlouhodobým působením kosmického prostředí. Nitro může být částečně rozvrstvené a v dávné minulosti se v něm možná nacházel podpovrchový oceán.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Titanie protínají obrovská zlomová údolí a kaňony, některé dlouhé stovky kilometrů. Naznačují, že se nitro měsíce kdysi rozpínalo a rozpraskalo ledovou kůru. Největší známý kaňon, Messina Chasma, lze rozsahem srovnat s významnými příkopovými propadlinami jinde ve Sluneční soustavě. Jméno Titania, stejně jako názvy dalších velkých měsíců Uranu, pochází z díla Williama Shakespeara.<br><br><a href='https://cs.wikipedia.org/wiki/Titania_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="oberon" data-title="Oberon" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/6/6d/Oberon_in_true_color_by_Kevin_M._Gill.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejvzdálenější z velkých měsíců Uranu. Tento tmavý svět hustě posetý krátery se po miliardy let téměř nezměnil a představuje zmrzlý záznam bouřlivé minulosti Sluneční soustavy.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 583 500 km a jeden oběh dokončí za 13,46 pozemského dne. Je slapově vázán na Uran.<br><br><b>Vzdálenost od Slunce:</b> Sdílí průměrnou vzdálenost Uranu od Slunce, tedy 19,2 astronomické jednotky neboli přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 523 km. Je o něco menší než Titania a představuje druhý největší měsíc Uranu.<br><br><b>Složení:</b> Směs vodního ledu a hornin podobná složení Titanie. Tmavší povrch však naznačuje vyšší podíl látek bohatých na uhlík nebo nashromážděných úlomků z dopadů mikrometeoroidů.<br><br><b>Pozoruhodné vlastnosti:</b> Povrchu dominují impaktní krátery, některé se světlými paprskovitými útvary svědčícími o relativně nedávných dopadech. Na rozdíl od Titanie vykazuje Oberon mnohem méně známek vnitřní činnosti a obnovování povrchu. Pravděpodobně brzy vychladl a zůstal geologicky neaktivní. V některých velkých kráterech se nacházejí světlé usazeniny, patrně led odkrytý zpod tmavší povrchové vrstvy.<br><br><a href='https://cs.wikipedia.org/wiki/Oberon_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="umbriel" data-title="Umbriel" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/2/2f/PIA00040_Umbrielx2.47.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Temný a záhadný měsíc Uranu, který je z jeho velkých družic vizuálně nejméně nápadný. Povrch je hustě pokrytý krátery a od vzniku tělesa zřejmě prodělal jen málo vnitřní geologické činnosti.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 266 000 km a jeden oběh dokončí za 4,14 pozemského dne. K Uranu obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást soustavy Uranu se nachází v průměrné vzdálenosti 19,2 astronomické jednotky, tedy přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 169 km. Je třetím největším měsícem Uranu.<br><br><b>Složení:</b> Převážně vodní led smíšený s horninami. Jeho mimořádně tmavý povrch pravděpodobně pokrývají látky bohaté na uhlík, pozměněné dlouhodobým působením záření.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Umbrielu je hustě poset impaktními krátery a téměř nejeví známky geologického přetváření. Nejvýraznějším útvarem je kráter Wunda se světlým prstencem uprostřed, který ostře kontrastuje s okolním tmavým terénem. Může jít o mladší materiál odkrytý z větší hloubky. Ve srovnání s ostatními velkými měsíci Uranu působí Umbriel jako těleso, které brzy vychladlo a zůstalo geologicky nečinné.<br><br><a href='https://cs.wikipedia.org/wiki/Umbriel_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="ariel" data-title="Ariel" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Ariel_in_monochrome.jpg/960px-Ariel_in_monochrome.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejsvětlejší a jeden z geologicky nejaktivnějších měsíců Uranu. Na rozdíl od tmavého Umbrielu nese jeho povrch rozsáhlé stopy dávné tektonické a možná i kryovulkanické činnosti.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 191 000 km a jeden oběh dokončí za 2,52 pozemského dne. Je slapově vázán na Uran.<br><br><b>Vzdálenost od Slunce:</b> Sdílí průměrnou vzdálenost Uranu od Slunce, tedy 19,2 astronomické jednotky neboli přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 158 km. Je o něco menší než Umbriel, ale geologicky mnohem členitější.<br><br><b>Složení:</b> Směs vodního ledu a hornin. Relativně světlý povrch naznačuje mladší vrstvy, které překryly starší terén. Byl na něm také zjištěn led oxidu uhličitého, jenž se mohl zachovat nebo postupně doplňovat.<br><br><b>Pozoruhodné vlastnosti:</b> Ariel protínají rozsáhlé soustavy kaňonů a zlomových údolí i hladké pláně, které mohly vzniknout prouděním ledového materiálu. Možným mechanismem je kryovulkanismus, při němž místo roztavených hornin vystupuje voda a další těkavé látky. Tyto stopy naznačují, že nitro Arielu zůstalo aktivní déle než u sousedních měsíců. Z velkých družic Uranu má zřejmě geologicky nejmladší povrch.<br><br><a href='https://cs.wikipedia.org/wiki/Ariel_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="miranda" data-title="Miranda" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Miranda_mosaic_in_color_-_Voyager_2.png/960px-Miranda_mosaic_in_color_-_Voyager_2.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejmenší a nejvnitřnější z pěti velkých měsíců Uranu. Miranda patří mezi geologicky nejpodivuhodnější světy Sluneční soustavy: její povrch připomíná mozaiku nesourodých oblastí, jako by byl sestaven z různých kusů.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 129 900 km a jeden oběh dokončí za 1,41 pozemského dne. K Uranu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Sdílí průměrnou vzdálenost Uranu, tedy 19,2 astronomické jednotky neboli přibližně 2,87 miliardy kilometrů od Slunce.<br><br><b>Velikost:</b> Průměr přibližně 472 km. Je podstatně menší než ostatní velké měsíce Uranu, přesto má mimořádně složitý povrch.<br><br><b>Složení:</b> Převážně vodní led smíšený s horninami. Nízká hustota naznačuje vysoký podíl ledu a možná také relativně málo soudržné nitro.<br><br><b>Pozoruhodné vlastnosti:</b> Miranda má obrovské skalní a ledové srázy včetně útvaru Verona Rupes, jehož výška může dosahovat až 20 km. Povrch tvoří odlišné oblasti zvané koróny, charakteristické hřebeny, údolími a neobvyklými geometrickými vzory. Dřívější hypotéza předpokládala, že se Miranda po mohutné srážce rozpadla a znovu spojila, dnes se však tato možnost pokládá za méně pravděpodobnou. Její neobvyklý terén mohl vzniknout v důsledku dávného slapového zahřívání a vnitřní geologické činnosti.<br><br><a href='https://cs.wikipedia.org/wiki/Miranda_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="puck" data-title="Puck" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/d/d1/Puck%2C_moon_of_Uranus_%281986%29.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý vnitřní měsíc Uranu, který svou velikostí stojí mezi velkými kulovými měsíci a drobnými nepravidelnými vnějšími družicemi. Má povrch pokrytý krátery a vykazuje jen málo známek geologické činnosti.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti 86 000 km a jeden oběh dokončí za 0,76 pozemského dne, tedy méně než 19 hodin. K Uranu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Jako součást soustavy Uranu se nachází v průměrné vzdálenosti 19,2 astronomické jednotky, přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 162 km. Je příliš malý na to, aby jej gravitace vytvarovala do dokonalé koule, i když působí poměrně zaobleně.<br><br><b>Složení:</b> Pravděpodobně vodní led smíšený s tmavšími horninami. Malá odrazivost povrchu naznačuje dlouhodobé působení kosmického prostředí a hromadění tmavého materiálu.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Pucku pokrývají četné impaktní krátery, z nichž některé jsou vzhledem k jeho velikosti značně rozsáhlé. Nejsou známy známky sopečné činnosti ani výrazného obnovování povrchu, takže se od svého vzniku patrně příliš nezměnil. Byl objeven v roce 1985 a podrobněji jej v roce 1986 vyfotografovala sonda Voyager 2.<br><br><a href='https://cs.wikipedia.org/wiki/Puck_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="caliban" data-title="Caliban" data-desc="<br>Nepravidelný vnější měsíc Uranu, patřící do vzdálené skupiny malých družic. Pravděpodobně jde o těleso zachycené gravitací planety, nikoli o měsíc, který vznikl na současné dráze.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti asi 7,2 milionu kilometrů a jeden oběh dokončí přibližně za 579 pozemských dní. Na rozdíl od pravidelných vnitřních měsíců je jeho dráha výrazně skloněná a protáhlá.<br><br><b>Vzdálenost od Slunce:</b> Sdílí průměrnou vzdálenost Uranu od Slunce, tedy 19,2 astronomické jednotky neboli přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Odhadovaný průměr asi 72 km. Jde o malé těleso nepravidelného tvaru.<br><br><b>Složení:</b> Pravděpodobně směs hornin a ledu s tmavým načervenalým povrchem. To může naznačovat přítomnost složitějších organických sloučenin změněných působením záření.<br><br><b>Pozoruhodné vlastnosti:</b> Caliban obíhá Uran retrográdně, tedy opačným směrem, než se planeta otáčí. To silně podporuje hypotézu o jeho zachycení. Vzdálená a skloněná dráha jej odlišuje od vnitřních měsíců a poskytuje vodítka k pochopení bouřlivého vývoje soustavy Uranu.<br><br><a href='https://cs.wikipedia.org/wiki/Caliban_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="sycorax" data-title="Sycorax" data-desc="<br>Největší z nepravidelných vnějších měsíců Uranu. Tento vzdálený a slabě osvětlený svět pravděpodobně vznikl jinde ve Sluneční soustavě a teprve později jej zachytila gravitace Uranu.<br><br><b>Vzdálenost od Uranu:</b> Obíhá v průměrné vzdálenosti asi 12,2 milionu kilometrů a jeden oběh dokončí přibližně za 1 288 pozemských dní. Jeho dráha je výrazně skloněná a protáhlá.<br><br><b>Vzdálenost od Slunce:</b> Jako součást soustavy Uranu se nachází v průměrné vzdálenosti 19,2 astronomické jednotky, přibližně 2,87 miliardy kilometrů.<br><br><b>Velikost:</b> Odhadovaný průměr přibližně 157 km. Jde o největší známý nepravidelný měsíc Uranu.<br><br><b>Složení:</b> Pravděpodobně směs hornin a ledu s tmavým načervenalým povrchem, podobná jiným zachyceným vnějším měsícům a některým objektům Kuiperova pásu.<br><br><b>Pozoruhodné vlastnosti:</b> Sycorax obíhá retrográdně, což podporuje představu, že byla zachycena gravitací Uranu. Její relativně velké rozměry naznačují, že může být pozůstatkem ještě většího rozbitého tělesa nebo jedním z větších objektů, které se podařilo zachytit. Pohybuje se daleko za pravidelnými měsíci v oblasti se složitými gravitačními vztahy.<br><br><a href='https://cs.wikipedia.org/wiki/Sycorax_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="titan" data-title="Titan" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/f/fe/Titan_in_true_color_by_Kevin_M._Gill.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Největší měsíc Saturnu a jeden ze světů Sluneční soustavy, které se v některých ohledech nejvíce podobají Zemi. Panují zde ovšem teploty, při nichž by vaše krev zmrzla dříve, než byste se stihli pokochat výhledem.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 1 221 870 km a jeden oběh dokončí za 15,95 pozemského dne. K Saturnu obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Saturnovy soustavy se nachází v průměrné vzdálenosti 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 5 151 km. Je druhým největším měsícem Sluneční soustavy a dokonce větším tělesem než planeta Merkur.<br><br><b>Složení:</b> Směs hornin a ledu s hustou atmosférou bohatou na dusík, jedinou hustou atmosférou známou u přirozené družice. Tlak na povrchu dosahuje asi jedenapůlnásobku pozemské hodnoty.<br><br><b>Pozoruhodné vlastnosti:</b> Titan má jezera, řeky a moře, ovšem nikoli z vody, nýbrž z kapalného metanu a etanu. Pod hustým oranžovým oparem se skrývá krajina utvářená počasím, erozí a možná i kryovulkanismem. Pozorování naznačují, že pod ledovou kůrou může existovat oceán kapalné vody. Titan patří mezi nejslibnější místa pro zkoumání prebiotické chemie, tedy chemických procesů, které mohly předcházet vzniku života.<br><br><a href='https://cs.wikipedia.org/wiki/Titan_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="rhea" data-title="Rhea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/PIA07763_Rhea_full_globe5.jpg/960px-PIA07763_Rhea_full_globe5.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Druhý největší měsíc Saturnu. Rhea je chladný svět hustě pokrytý krátery, typický příklad osudu středně velkých ledových měsíců: geologicky klidný a po miliardy let téměř nezměněný.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 527 000 km a jeden oběh dokončí za 4,52 pozemského dne. K Saturnu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Sdílí průměrnou vzdálenost Saturnu 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 528 km, což z ní činí devátý největší měsíc Sluneční soustavy.<br><br><b>Složení:</b> Převážně vodní led s menším podílem hornin, díky čemuž má relativně nízkou hustotu. Její světlý povrch odráží značnou část dopadajícího slunečního světla.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Rhey je posetý impaktními krátery včetně několika velmi rozsáhlých pánví. Existují náznaky mimořádně řídké atmosféry obsahující kyslík a oxid uhličitý. Některá pozorování také naznačovala možnost dávné slabé soustavy prstenců, ta však zůstává předmětem diskusí.<br><br><a href='https://cs.wikipedia.org/wiki/Rhea_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="iapetus" data-title="Iapetus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/ad/Iapetus_trailing_natural_color.jpg/960px-Iapetus_trailing_natural_color.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Jeden z nejpodivnějších Saturnových měsíců. Proslul dramatickým dvojbarevným povrchem: jedna polokoule je tmavá jako uhlí, zatímco druhá je světlá a silně odráží sluneční světlo.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 3 560 800 km a jeden oběh dokončí za 79,3 pozemského dne. Je slapově vázán na Saturn a stále k němu obrací stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Saturnovu průměrnou vzdálenost 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 471 km.<br><br><b>Složení:</b> Směs vodního ledu a hornin. Tmavý materiál na náběžné polokouli pravděpodobně pochází z vnějších zdrojů a jeho rozložení dále zvýraznily tepelné procesy.<br><br><b>Pozoruhodné vlastnosti:</b> Tmavá oblast zvaná Cassini Regio pohlcuje více slunečního záření, takže se v ní led snáze vypařuje a přesouvá do světlejších oblastí, čímž se barevný kontrast dále zvětšuje. Ještě podivuhodnější je mohutný rovníkový hřbet táhnoucí se téměř kolem celého měsíce. Dosahuje výšky až 20 km a dává Iapetu vzhled připomínající vlašský ořech. Jeho původ není objasněn; mohl vzniknout z dávného prstence nebo vnitřními geologickými procesy.<br><br><a href='https://cs.wikipedia.org/wiki/Iapetus_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="dione" data-title="Dione" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Dione_in_natural_light.jpg/960px-Dione_in_natural_light.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Středně velký ledový měsíc Saturnu, který na první pohled působí jako nečinné těleso plné kráterů. Podrobnější pozorování však odhalují stopy mnohem dynamičtější minulosti.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 377 400 km a jeden oběh dokončí za 2,74 pozemského dne. K Saturnu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Saturnovy soustavy se nachází v průměrné vzdálenosti 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 123 km.<br><br><b>Složení:</b> Převážně vodní led s kamenným nitrem. Její relativně vysoká hustota naznačuje větší podíl hornin než u některých menších ledových měsíců.<br><br><b>Pozoruhodné vlastnosti:</b> Dione je známá světlými pruhy připomínajícími jemné žilkování. Jde o ledové srázy a zlomy vzniklé tektonickou činností, nikoli o usazeniny. Tyto útvary dokládají dávnou geologickou aktivitu, kterou mohlo pohánět slapové zahřívání. Některé poznatky také naznačují, že hluboko pod ledovou kůrou může dodnes existovat oceán kapalné vody.<br><br><a href='https://cs.wikipedia.org/wiki/Dione_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="tethys" data-title="Tethys" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/87/Tethys_-_Rev_15_%2837267740632%29.png/960px-Tethys_-_Rev_15_%2837267740632%29.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Středně velký ledový měsíc Saturnu s pozoruhodně světlým povrchem hustě pokrytým krátery. Jeho vzhled určují především dva obrovské geologické útvary.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 294 700 km a jeden oběh dokončí za 1,89 pozemského dne. K Saturnu obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Saturnovy soustavy se nachází v průměrné vzdálenosti 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 1 062 km.<br><br><b>Složení:</b> Téměř výhradně vodní led, díky němuž patří Tethys mezi měsíce s nejnižší hustotou. Je to v podstatě zmrzlá koule s malým podílem hornin.<br><br><b>Pozoruhodné vlastnosti:</b> Povrchu dominuje obrovský impaktní kráter Odysseus o průměru asi 400 km, tedy téměř polovině průměru celého měsíce. Dalším výrazným útvarem je Ithaca Chasma, systém kaňonů dlouhý přes 2 000 km. Pravděpodobně vznikl při mrznutí a rozpínání nitra, které popraskalo ledovou kůru. Navzdory těmto dramatickým strukturám nejsou známky nedávné geologické činnosti příliš výrazné.<br><br><a href='https://cs.wikipedia.org/wiki/Tethys_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="enceladus" data-title="Enceladus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/83/PIA17202_-_Approaching_Enceladus.jpg/960px-PIA17202_-_Approaching_Enceladus.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý, ale mimořádně aktivní měsíc Saturnu a jeden z nejdůležitějších cílů při hledání mimozemského života ve Sluneční soustavě.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 238 000 km a jeden oběh dokončí za 1,37 pozemského dne. K Saturnu obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Saturnovu průměrnou vzdálenost 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 504 km.<br><br><b>Složení:</b> Převážně vodní led s kamenným jádrem. Pod ledovou kůrou se nachází globální podpovrchový oceán kapalné vody.<br><br><b>Pozoruhodné vlastnosti:</b> Z puklin poblíž jižního pólu, přezdívaných tygří pruhy, vyvrhuje Enceladus obrovské gejzíry vodní páry, ledových částic a organických sloučenin. Tyto výtrysky zásobují Saturnův prstenec E a představují přímý důkaz podpovrchového oceánu, jehož voda přichází do styku s horninami. To je jedna z důležitých podmínek pro možný život. Sonda Cassini ve výtryscích objevila soli a organické molekuly.<br><br><a href='https://cs.wikipedia.org/wiki/Enceladus_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="mimas" data-title="Mimas" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Mimas_Masked.jpg/960px-Mimas_Masked.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý ledový měsíc Saturnu, jehož vzhledu dominuje jediný obrovský útvar. Právě kvůli němu bývá přirovnáván k jisté známé filmové bitevní stanici.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 185 500 km a jeden oběh dokončí za 0,94 pozemského dne. K Saturnu obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Saturnovy soustavy se nachází v průměrné vzdálenosti 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 396 km.<br><br><b>Složení:</b> Převážně vodní led s malým podílem hornin, což vysvětluje nízkou hustotu a poměrně malou pevnost tělesa.<br><br><b>Pozoruhodné vlastnosti:</b> Povrchu dominuje kráter Herschel o průměru asi 130 km, který dává Mimasu nápadnou podobnost s jistou fiktivní bitevní stanicí. Náraz, který kráter vytvořil, měsíc téměř roztříštil. Ačkoli je povrch hustě pokryt krátery a nevykazuje zjevné známky současné geologické činnosti, analýza oběžné dráhy zveřejněná v roce 2024 přinesla silné důkazy o existenci mladého globálního oceánu pod ledovou kůrou silnou přibližně 20–30 km.<br><br><a href='https://cs.wikipedia.org/wiki/Mimas_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>
