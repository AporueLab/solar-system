            <div class="hotspot" id="hyperion" data-title="Hyperion" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Hyperion_true.jpg/960px-Hyperion_true.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nepravidelný měsíc Saturnu připomínající mořskou houbu. Hyperion je jedním z nejpodivuhodnějších těles Sluneční soustavy, a to nejen vzhledem, ale také svým pohybem.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 1 481 000 km a jeden oběh dokončí za 21,3 pozemského dne. Jeho rotace je chaotická: místo stabilní orientace se nepředvídatelně převaluje.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Saturnovu průměrnou vzdálenost 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 270 × 205 × 163 km; má výrazně nepravidelný tvar.<br><br><b>Složení:</b> Velmi pórovitá směs vodního ledu a hornin s mimořádně nízkou hustotou. Jeho nitro je zřejmě volně uspořádané a obsahuje mnoho dutin.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Hyperionu pokrývají hluboké krátery s ostrými okraji, které mu dodávají téměř organický, houbovitý vzhled. Chaotická rotace souvisí s gravitačním působením Saturnu a blízkého Titanu a její dlouhodobý průběh nelze spolehlivě předvídat. Na rozdíl od většiny měsíců se Hyperion neustálil ve slapově vázané rotaci.<br><br><a href='https://cs.wikipedia.org/wiki/Hyperion_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="phoebe" data-title="Phoebe" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Phoebe_cassini_full.jpg/960px-Phoebe_cassini_full.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Vnější měsíc Saturnu s odlišným původem než většina jeho vnitřních družic. Phoebe je pravděpodobně zachyceným tělesem ze vzdálené vnější Sluneční soustavy, příbuzným objektům Kuiperova pásu.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 12,95 milionu kilometrů a jeden oběh trvá asi 550 pozemských dní. Její pohyb je retrográdní, tedy proti směru rotace Saturnu.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Saturnovu průměrnou vzdálenost 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 213 km.<br><br><b>Složení:</b> Směs hornin, ledu a sloučenin bohatých na uhlík, díky nimž je povrch výrazně tmavší než u vnitřních Saturnových měsíců.<br><br><b>Pozoruhodné vlastnosti:</b> Retrográdní a výrazně skloněná dráha silně naznačuje, že Phoebe nevznikla společně se Saturnem, ale byla zachycena jeho gravitací. Její tmavý materiál pravděpodobně přispívá k zabarvení náběžné polokoule měsíce Iapetus. Nepravidelný tvar a četné krátery z ní činí cenný zdroj informací o dávných tělesech vnější Sluneční soustavy.<br><br><a href='https://cs.wikipedia.org/wiki/Phoebe_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="janus" data-title="Janus" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/PIA12714_Janus_crop.jpg/960px-PIA12714_Janus_crop.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý vnitřní měsíc Saturnu, pozoruhodný především neobvyklým vztahem se sousedním měsícem Epimetheus. Společně představují vzácný příklad dvou těles sdílejících téměř stejnou oběžnou dráhu.<br><br><b>Vzdálenost od Saturnu:</b> Obíhá v průměrné vzdálenosti 151 500 km a s Epimetheem sdílí téměř totožnou dráhu. Jeden oběh trvá asi 0,69 pozemského dne.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Saturnovy soustavy se nachází v průměrné vzdálenosti 9,58 astronomické jednotky, přibližně 1,43 miliardy kilometrů.<br><br><b>Velikost:</b> Střední průměr přibližně 179 km.<br><br><b>Složení:</b> Převážně vodní led s menším podílem hornin, podobně jako u dalších vnitřních Saturnových měsíců.<br><br><b>Pozoruhodné vlastnosti:</b> Janus a Epimetheus si jednou za několik let vymění pořadí svých oběžných drah. Gravitační interakce jim umožňuje vyhnout se srážce a vytváří vzácné stabilní uspořádání. Janus má nepravidelný tvar a jeho povrch pokrývá mnoho kráterů, což svědčí o dlouhé historii dopadů a jen malé geologické proměnlivosti.<br><br><a href='https://cs.wikipedia.org/wiki/Janus_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="ganymede" data-title="Ganymed" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Ganymede_-_Perijove_34_Composite.png/960px-Ganymede_-_Perijove_34_Composite.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Největší měsíc Sluneční soustavy. Ganymed je dokonce větší než planeta Merkur a jeho složité vnitřní uspořádání se vyrovná některým menším planetám.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 1 070 400 km a jeden oběh dokončí za 7,15 pozemského dne. K Jupiteru obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Jupiterovy soustavy se nachází v průměrné vzdálenosti 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 5 268 km, nejvíce ze všech měsíců Sluneční soustavy.<br><br><b>Složení:</b> Rozvrstvené těleso s kovovým jádrem, kamenným pláštěm a ledovou kůrou. Je to jediný známý měsíc, který vytváří vlastní globální magnetické pole.<br><br><b>Pozoruhodné vlastnosti:</b> Na povrchu se střídají staré oblasti silně pokryté krátery s mladšími pásy rýhovaného terénu, které vznikly tektonickou činností. Pod ledovou slupkou se pravděpodobně ukrývá hluboký oceán s větším množstvím vody, než obsahují všechny pozemské oceány dohromady. Jeho magnetické pole vyvolává polární záře, díky čemuž se Ganymed v mnoha ohledech podobá planetě.<br><br><a href='https://cs.wikipedia.org/wiki/Ganymed_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="callisto" data-title="Callisto" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/c/c6/Callisto_VGR2_C2060635_OGB.png/960px-Callisto_VGR2_C2060635_OGB.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejvzdálenější ze čtyř velkých Galileových měsíců Jupiteru. Callisto je starobylý svět hustě posetý krátery, jehož povrch se po miliardy let téměř nezměnil.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 1 882 700 km a jeden oběh trvá 16,69 pozemského dne. K Jupiteru obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Jupiterovu průměrnou vzdálenost 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 4 821 km, což z ní činí třetí největší měsíc Sluneční soustavy.<br><br><b>Složení:</b> Směs hornin a ledu, jejíž nitro je pravděpodobně pouze částečně rozvrstvené, bez výrazně odděleného jádra.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Callisto patří k nejstarším ve Sluneční soustavě a je prakticky celý pokryt impaktními krátery. Nejnápadnějším útvarem je Valhalla, rozsáhlá mnohaprstencová impaktní pánev o průměru několika tisíc kilometrů. Na rozdíl od Ganymedu či Europy vykazuje Callisto málo známek vnitřní aktivity, ale hluboko pod kůrou může existovat oceán. Poměrně slabé radiační prostředí z ní dělá zajímavý cíl budoucího průzkumu lidmi.<br><br><a href='https://cs.wikipedia.org/wiki/Callisto_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="io" data-title="Io" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Io_highest_resolution_natural_color.png/960px-Io_highest_resolution_natural_color.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Vulkanicky nejaktivnější těleso Sluneční soustavy. Povrch měsíce Io se neustálými erupcemi přetváří mnohem rychleji než povrchy většiny planet.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 421 700 km a jeden oběh dokončí za 1,77 pozemského dne. K Jupiteru obrací stále stejnou stranu.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Jupiterovy soustavy se nachází v průměrné vzdálenosti 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 3 643 km.<br><br><b>Složení:</b> Převážně kamenné těleso s malým množstvím vodního ledu. Jeho nitro zahřívají silné slapové účinky Jupiterovy gravitace a gravitačního působení sousedních měsíců.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Io pokrývají stovky aktivních sopek; některé vyvrhují sopečné chocholy až 500 km vysoko. Výrazné žluté, červené a černé odstíny způsobuje síra a její sloučeniny ukládané při nepřetržité sopečné činnosti. Díky rychlému obnovování povrchu se zde téměř nehromadí impaktní krátery.<br><br><a href='https://cs.wikipedia.org/wiki/Io_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="europa" data-title="Europa" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Europa_-_Perijove_45_%28cropped%29.png/960px-Europa_-_Perijove_45_%28cropped%29.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Hladký ledový měsíc Jupiteru, který patří k nejslibnějším místům ve Sluneční soustavě pro hledání mimozemského života.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 670 900 km a jeden oběh dokončí za 3,55 pozemského dne. K Jupiteru obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Jupiterovu průměrnou vzdálenost 5,2 astronomické jednotky, tedy přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 3 122 km.<br><br><b>Složení:</b> Kamenné nitro pokryté silnou vrstvou vodního ledu. Pod ledovou kůrou se nachází globální oceán kapalné vody.<br><br><b>Pozoruhodné vlastnosti:</b> Povrch Europy je mimořádně hladký, s malým počtem kráterů a sítí tmavých pruhů a puklin vznikajících slapovým namáháním. Její podpovrchový oceán může obsahovat více než dvojnásobek vody pozemských oceánů. Reakce mezi vodou a horninami na dně by mohly poskytovat chemickou energii potřebnou pro život, a Europa je proto významným cílem budoucích kosmických misí.<br><br><a href='https://cs.wikipedia.org/wiki/Europa_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="amalthea" data-title="Amalthea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/b/b1/Amalthea_PIA02532.png/330px-Amalthea_PIA02532.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Malý nepravidelný vnitřní měsíc Jupiteru, který obíhá hluboko uvnitř oblasti vystavené intenzivnímu záření planety.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 181 400 km a jeden oběh dokončí za 0,50 pozemského dne, tedy přibližně 12 hodin.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Jupiterovy soustavy se nachází v průměrné vzdálenosti 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 250 × 146 × 128 km. Je nepravidelná, nikoli kulová.<br><br><b>Složení:</b> Pravděpodobně ji tvoří pórovitý vodní led smíšený s tmavším materiálem, přestože v takové blízkosti Jupiteru by mohl led snadno sublimovat.<br><br><b>Pozoruhodné vlastnosti:</b> Amalthea má nerovný povrch s mnoha krátery, velkými prohlubněmi a hřebeny. Její nízká hustota naznačuje, že může být tvořena volně spojenou sutí. Nárazům drobných meteoroidů vděčí za uvolňování prachu, který přispívá k vytváření slabého Jupiterova prstence.<br><br><a href='https://cs.wikipedia.org/wiki/Amalthea_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="himalia" data-title="Himalia" data-desc="<br>Největší z nepravidelných vnějších měsíců Jupiteru a členka vzdálené skupiny družic, které pravděpodobně vznikly rozpadem zachycené planetky.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti asi 11,5 milionu kilometrů a jeden oběh trvá přibližně 250 pozemských dní. Její dráha je skloněná a mírně protáhlá.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Jupiterovu průměrnou vzdálenost 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 170 km.<br><br><b>Složení:</b> Pravděpodobně směs hornin a ledu s tmavým povrchem, podobná uhlíkatým planetkám typu C.<br><br><b>Pozoruhodné vlastnosti:</b> Himalia je největším členem skupiny stejnojmenných měsíců, jejichž podobné oběžné dráhy naznačují společný původ v rozpadlé zachycené planetce. Nepravidelný tvar a vzdálená dráha ji odlišují od velkých pravidelných měsíců Jupiteru.<br><br><a href='https://cs.wikipedia.org/wiki/Himalia_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="thebe" data-title="Thebe" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/1/1b/Thebe.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Vnitřní měsíc Jupiteru obíhající těsně za Amaltheou. Stejně jako ona má nepravidelný tvar a tmavý povrch.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 221 900 km a jeden oběh dokončí za 0,67 pozemského dne, přibližně 16 hodin.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Jupiterovy soustavy se nachází v průměrné vzdálenosti 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 116 × 98 × 84 km; není kulová.<br><br><b>Složení:</b> Pravděpodobně ji tvoří pórovitý led smíšený s tmavšími horninami. Nízká hustota naznačuje jen slabě stmelené nitro.<br><br><b>Pozoruhodné vlastnosti:</b> Thebe je silně pokryta krátery, z nichž některé jsou vzhledem k velikosti měsíce mimořádně rozsáhlé. Stejně jako Amalthea dodává prach do slabé prstencové soustavy Jupiteru a vytváří takzvaný prstenec Thebe. Její blízkost k Jupiteru znamená silné slapové působení a intenzivní radiaci.<br><br><a href='https://cs.wikipedia.org/wiki/Thebe_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="elara" data-title="Elara" data-desc="<br>Jeden z větších nepravidelných vnějších měsíců Jupiteru. Patří do vzdálené skupiny družic, které pravděpodobně vznikly rozpadem původně zachyceného většího tělesa.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti asi 11,7 milionu kilometrů a jeden oběh trvá přibližně 259 pozemských dní. Její dráha je skloněná a mírně protáhlá.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Jupiterovu průměrnou vzdálenost 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 86 km.<br><br><b>Složení:</b> Pravděpodobně směs hornin a ledu s tmavým povrchem a nízkou odrazivostí, podobně jako u jiných nepravidelných měsíců.<br><br><b>Pozoruhodné vlastnosti:</b> Elara patří do skupiny Himalia, jejíž členové mají podobné oběžné dráhy a pravděpodobně společný původ v rozpadlé zachycené planetce. Obíhá daleko od velkých pravidelných měsíců Jupiteru v oblasti se složitými gravitačními poměry.<br><br><a href='https://cs.wikipedia.org/wiki/Elara_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="metis" data-title="Metis" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/9/9a/Metis.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Nejvnitřnější známý měsíc Jupiteru. Obíhá mimořádně blízko planety, v oblasti, kde působí silné slapové síly.<br><br><b>Vzdálenost od Jupiteru:</b> Obíhá v průměrné vzdálenosti 128 000 km a jeden oběh dokončí za 0,29 pozemského dne, tedy přibližně 7 hodin.<br><br><b>Vzdálenost od Slunce:</b> Jako součást Jupiterovy soustavy se nachází v průměrné vzdálenosti 5,2 astronomické jednotky, asi 778 milionů kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 60 × 40 × 34 km; má silně nepravidelný tvar.<br><br><b>Složení:</b> Pravděpodobně ji tvoří pórovité horniny a led, i když její blízkost k Jupiteru vyvolává otázky ohledně dlouhodobé stability těchto materiálů.<br><br><b>Pozoruhodné vlastnosti:</b> Metis obíhá uvnitř hlavního Jupiterova prstence a je významným zdrojem jeho materiálu. Drobné dopady meteoroidů z ní neustále uvolňují prach. Její dráha leží blízko Rocheovy meze Jupiteru, za níž mohou slapové síly roztrhat slabě soudržná tělesa. Metis však prozatím zůstává celistvá.<br><br><a href='https://cs.wikipedia.org/wiki/Metis_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="adrastea" data-title="Adrastea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/e/e4/Adrastea.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Drobný vnitřní měsíc Jupiteru, jeden z nejmenších známých měsíců Sluneční soustavy. Obíhá mimořádně blízko své planety.<br><br><b>Vzdálenost od Jupiteru:</b> Průměrně 129 000 km. Jeden oběh dokončí za 0,30 pozemského dne, tedy něco přes 7 hodin.<br><br><b>Vzdálenost od Slunce:</b> Sdílí Jupiterovu průměrnou vzdálenost 5,2 astronomické jednotky, přibližně 778 milionů kilometrů.<br><br><b>Velikost:</b> Odhadované rozměry 20 × 16 × 14 km. Je velmi malá a nepravidelná.<br><br><b>Složení:</b> Pravděpodobně horniny a led s povrchem ztmavlým dlouhodobým působením kosmického prostředí.<br><br><b>Pozoruhodné vlastnosti:</b> Adrastea obíhá uvnitř hlavního Jupiterova prstence a stejně jako Metis přispívá k jeho materiálu. Nachází se v oblasti silné gravitace a radiace. Patřila k prvním měsícům objeveným pomocí kosmické sondy místo pozemního pozorování; byla rozpoznána na snímcích Voyageru 2.<br><br><a href='https://cs.wikipedia.org/wiki/Adrastea_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="ceres" data-title="Ceres" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/7/76/Ceres_-_RC3_-_Haulani_Crater_%2822381131691%29_%28cropped%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Největší těleso v pásu planetek a jediné, které je oficiálně klasifikováno jako trpasličí planeta. Ceres představuje přechod mezi kamennými planetkami a ledovými tělesy vnější Sluneční soustavy.<br><br><b>Vzdálenost od Slunce:</b> Obíhá v průměrné vzdálenosti 2,77 astronomické jednotky, tedy přibližně 414 milionů kilometrů.<br><br><b>Oběžná doba:</b> Jeden rok na Ceres trvá asi 4,6 pozemského roku.<br><br><b>Velikost:</b> Průměr přibližně 940 km. Na Ceres připadá zhruba třetina celkové hmotnosti pásu planetek.<br><br><b>Složení:</b> Směs hornin a vodního ledu. Byly zjištěny minerály obsahující vázanou vodu a existují náznaky možné podpovrchové vrstvy slané vody.<br><br><b>Pozoruhodné vlastnosti:</b> Ceres vykazuje známky překvapivě složité a na své rozměry dlouhotrvající geologické činnosti. Její nitro pravděpodobně tvoří kamenné jádro nebo bahnitý plášť pod kůrou ze směsi ledu, solí a jílu. Vodní led může představovat přibližně čtvrtinu její hmotnosti. Světlá ložiska v kráteru Occator, včetně útvarů Cerealia Facula a Vinalia Faculae, tvoří sodné soli, které na povrchu zůstaly po výstupu slané vody z nitra. Nachází se zde také Ahuna Mons, geologicky mladá ledová sopka, a další kryovulkanické kupy, které se postupně zplošťovaly.<br><br>Na povrchu byly objeveny organické sloučeniny, zejména v okolí kráteru Ernutet, což naznačuje přítomnost materiálu bohatého na uhlík. Ceres má přechodnou, mimořádně řídkou exosféru vodní páry, která pravděpodobně vzniká sublimací ledu nebo slabým uvolňováním plynů z nitra. Migrace slaných roztoků, postupné přetváření povrchu a kryovulkanismus společně ukazují, že Ceres zůstala geologicky aktivní mnohem déle, než se u tak malého tělesa očekávalo.<br><br><a href='https://cs.wikipedia.org/wiki/Ceres_(trpasli%C4%8D%C3%AD_planeta)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="vesta" data-title="Vesta" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/51/Vesta_in_natural_color.jpg/960px-Vesta_in_natural_color.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Druhé nejhmotnější těleso v pásu planetek. Vesta je protoplaneta, tedy těleso, které se začalo vyvíjet v planetu, ale tento proces nikdy nedokončilo.<br><br><b>Vzdálenost od Slunce:</b> Obíhá v průměrné vzdálenosti 2,36 astronomické jednotky, tedy přibližně 353 milionů kilometrů.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá asi 3,63 pozemského roku.<br><br><b>Velikost:</b> Střední průměr přibližně 525 km.<br><br><b>Složení:</b> Podobně jako kamenné planety má Vesta rozlišené vrstvy: kůru, plášť a jádro. Povrch tvoří převážně čedičové horniny, což svědčí o dávné sopečné činnosti.<br><br><b>Pozoruhodné vlastnosti:</b> Na jižním pólu Vesty se nachází Rheasilvia, jedna z největších impaktních pánví ve Sluneční soustavě. Její středový vrchol dosahuje výšky přibližně 22 km. Předpokládá se, že z Vesty pochází řada meteoritů nalezených na Zemi, které vědcům umožňují přímo studovat geologii planetárních těles. Vestu navštívila také sonda Dawn, která odhalila její složitou geologickou minulost.<br><br><a href='https://cs.wikipedia.org/wiki/Vesta_(planetka)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="pallas" data-title="Pallas" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/d/d4/Potw1749a_Pallas_crop.png' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Jedno z největších těles pásu planetek. Pallas se vyznačuje neobvykle skloněnou oběžnou dráhou, a její pohyb se tak výrazně liší od mnoha sousedních planetek.<br><br><b>Vzdálenost od Slunce:</b> Obíhá v průměrné vzdálenosti 2,77 astronomické jednotky, tedy přibližně 414 milionů kilometrů. Je tak od Slunce podobně daleko jako Ceres, ale pohybuje se po mnohem více skloněné dráze.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá přibližně 4,6 pozemského roku.<br><br><b>Velikost:</b> Střední průměr přibližně 512 km.<br><br><b>Složení:</b> Pravděpodobně ji tvoří křemičitanové horniny s určitým podílem minerálů obsahujících vodu. Zdá se však, že její nitro není rozvrstvené do tak výrazných vrstev jako u Vesty.<br><br><b>Pozoruhodné vlastnosti:</b> Sklon dráhy Pallas dosahuje přibližně 34°, takže patří mezi velká tělesa Sluneční soustavy s nejvýrazněji skloněnými oběžnými drahami. Její povrch je silně pokryt impaktními krátery. Ve srovnání s Ceres a Vestou je Pallas prozkoumána podstatně méně, protože ji dosud nenavštívila žádná kosmická sonda. Její neobvyklá dráha může svědčit o bouřlivější minulosti pásu planetek.<br><br><a href='https://cs.wikipedia.org/w/index.php?search=(2)%20Pallas%20planetka&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="hygiea" data-title="Hygiea" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/SPHERE_image_of_Hygiea.jpg/960px-SPHERE_image_of_Hygiea.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Čtvrté největší těleso pásu planetek. Hygiea je tmavá planetka s poměrně nízkou hustotou, jejíž téměř kulový tvar naznačuje, že by mohla splňovat podmínky pro zařazení mezi trpasličí planety.<br><br><b>Vzdálenost od Slunce:</b> Obíhá v průměrné vzdálenosti 3,14 astronomické jednotky, tedy přibližně 470 milionů kilometrů.<br><br><b>Oběžná doba:</b> Jeden oběh kolem Slunce trvá asi 5,57 pozemského roku.<br><br><b>Velikost:</b> Střední průměr přibližně 434 km.<br><br><b>Složení:</b> Pravděpodobně ji tvoří materiál bohatý na uhlík smíšený s minerály obsahujícími vodu, což přispívá k jejímu velmi tmavému povrchu.<br><br><b>Pozoruhodné vlastnosti:</b> Pozorování ukazují, že Hygiea má na své rozměry překvapivě kulový tvar, a mohla by proto splňovat kritéria pro označení trpasličí planeta. V minulosti ji zřejmě silně poznamenala velká srážka a může představovat největší pozůstatek původně rozměrnějšího tělesa. Je hlavním členem rodiny planetek Hygiea.<br><br><a href='https://cs.wikipedia.org/w/index.php?search=(10)%20Hygiea%20planetka&amp;title=Speci%C3%A1ln%C3%AD%3AHled%C3%A1n%C3%AD' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="phobos" data-title="Phobos" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/5/5c/Phobos_colour_2008.jpg/960px-Phobos_colour_2008.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Větší a vnitřní ze dvou měsíců Marsu. Toto malé nepravidelné těleso obíhá tak blízko planety, že během jediného marsovského dne několikrát vychází a zapadá.<br><br><b>Vzdálenost od Marsu:</b> Obíhá přibližně 6 000 km nad povrchem Marsu a jeden oběh dokončí za 7 hodin a 39 minut, tedy rychleji, než se Mars otočí kolem osy.<br><br><b>Vzdálenost od Slunce:</b> Společně s Marsem se nachází v průměrné vzdálenosti 1,52 astronomické jednotky, přibližně 228 milionů kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 27 × 22 × 18 km; má nepravidelný tvar.<br><br><b>Složení:</b> Pravděpodobně jej tvoří horniny bohaté na uhlík a možná i led, podobně jako některé uhlíkaté planetky. Jeho skutečný původ však zůstává předmětem diskusí.<br><br><b>Pozoruhodné vlastnosti:</b> Povrchu dominuje mohutný kráter Stickney, jehož velikost dosahuje téměř poloviny rozměru měsíce. Doplňují jej rýhy a zlomy, patrně spojené s dávnými nárazy a slapovým namáháním. Phobos se postupně přibližuje k Marsu a během desítek milionů let se může rozpadnout v prstenec nebo dopadnout na planetu.<br><br><a href='https://cs.wikipedia.org/wiki/Phobos_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="deimos" data-title="Deimos" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/8/86/NASA-Deimos-MarsMoon-20090221.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Menší a vzdálenější měsíc Marsu. Oproti Phobosu působí hladším a zaoblenějším dojmem, má méně velkých kráterů a méně členitý povrch.<br><br><b>Vzdálenost od Marsu:</b> Obíhá v průměrné vzdálenosti přibližně 23 500 km a jeden oběh dokončí za 30,3 hodiny.<br><br><b>Vzdálenost od Slunce:</b> Stejně jako Mars se nachází v průměrné vzdálenosti 1,52 astronomické jednotky, tedy asi 228 milionů kilometrů.<br><br><b>Velikost:</b> Přibližné rozměry 15 × 12 × 11 km; je malý a nepravidelný, ale zaoblenější než Phobos.<br><br><b>Složení:</b> Pravděpodobně jej tvoří pórovité horniny a led podobně jako u Phobosu. Povrch pokrývá silná vrstva regolitu, která zahladila mnohé nerovnosti.<br><br><b>Pozoruhodné vlastnosti:</b> Deimos má výrazně méně velkých kráterů než Phobos, pravděpodobně proto, že sypký povrchový materiál postupně vyrovnává stopy po dopadech. Jeho původ není jistý: mohl vzniknout zachycením planetky nebo z materiálu na oběžné dráze Marsu. Jeho dráha je poměrně stabilní, na rozdíl od Phobosu, který se pomalu přibližuje k planetě.<br><br><a href='https://cs.wikipedia.org/wiki/Deimos_(m%C4%9Bs%C3%ADc)' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="themoon" data-title="Měsíc" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/960px-FullMoon2010.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Jediná přirozená družice Země. Měsíc je pátou největší přirozenou družicí Sluneční soustavy a jediným mimozemským tělesem, které dosud navštívili lidé.<br><br><b>Vzdálenost od Země:</b> Obíhá v průměrné vzdálenosti 384 400 km a jeden oběh dokončí za 27,3 dne. Jeho rotace je slapově vázána na Zemi, takže k ní obrací stále stejnou polokouli.<br><br><b>Vzdálenost od Slunce:</b> Jako součást soustavy Země se nachází v průměrné vzdálenosti jedné astronomické jednotky, přibližně 150 milionů kilometrů.<br><br><b>Velikost:</b> Průměr přibližně 3 474 km.<br><br><b>Složení:</b> Rozvrstvené těleso s malým jádrem, kamenným pláštěm a kůrou tvořenou především křemičitanovými minerály. Povrch pokrývá regolit, vrstva úlomků a prachu vznikající miliardy let dopady jiných těles.<br><br><b>Pozoruhodné vlastnosti:</b> Měsíční povrch tvoří světlé vysočiny a tmavší čedičové pláně zvané moře, které vznikly dávnou sopečnou činností. Měsíc pravděpodobně vznikl po obrovské srážce rané Země s tělesem velikosti Marsu, když se vyvržený materiál spojil v nové těleso. Jeho gravitace vytváří mořský příliv a odliv a pomáhá stabilizovat sklon zemské osy. Posádky programu Apollo v letech 1969–1972 přivezly vzorky, které zásadně změnily poznatky o vzniku planet.<br><br><a href='https://cs.wikipedia.org/wiki/M%C4%9Bs%C3%ADc' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="system" data-title="Sluneční soustava" data-desc="<img src='https://upload.wikimedia.org/wikipedia/commons/thumb/f/fb/Solar_System_true_color_%28captions%29.jpg/960px-Solar_System_true_color_%28captions%29.jpg' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Sluneční soustava je gravitačně vázaný systém, jehož středem je Slunce. Zahrnuje planety, měsíce, trpasličí planety, planetky, komety a nesmírné množství menších těles. Vznikla přibližně před 4,6 miliardy let z hroutícího se oblaku plynu a prachu.<br><br><b>Uspořádání:</b> Sluneční soustava se přibližně dělí na několik oblastí: vnitřní kamenné planety (Merkur, Venuše, Země a Mars), pás planetek, plynné a ledové obry (Jupiter, Saturn, Uran a Neptun), Kuiperův pás a vzdálený, přibližně kulovitý Oortův oblak. Jednotlivé oblasti odrážejí rozdílné teploty a dostupné materiály v době vzniku soustavy.<br><br><b>Rozměry:</b> Sluneční soustava se rozprostírá na vzdálenosti miliard kilometrů. Neptun obíhá asi 30 astronomických jednotek (4,5 miliardy kilometrů) od Slunce, zatímco Oortův oblak může sahat až do vzdálenosti 100 000 astronomických jednotek, tedy téměř 1,5 světelného roku. Jeho vnější okraj tak může být blíže sousedním hvězdám než samotnému Slunci.<br><br><b>Složení:</b> Přibližně 99,8 % celkové hmotnosti soustavy připadá na Slunce. Zbývající část tvoří planety a menší tělesa složená z hornin, kovů, ledu a plynů. Ve větších vzdálenostech od Slunce je zpravidla vyšší podíl ledových látek.<br><br><b>Pohyb těles:</b> Většina objektů obíhá přibližně ve stejné rovině a stejným směrem, což je pozůstatek původního rotujícího protoplanetárního disku. Gravitační působení, zejména velkých planet, jako je Jupiter, soustavu nadále utváří: menší tělesa může zachycovat, vyvrhovat nebo měnit jejich dráhy.<br><br><b>Pozoruhodné vlastnosti:</b> Ve Sluneční soustavě najdeme nesmírně rozmanité světy: od sopečně aktivního měsíce Io přes Europu s podpovrchovým oceánem až po metanová jezera na Titanu a ledové trpasličí planety za Neptunem. Je to také jediná dosud známá planetární soustava, v níž existuje život. Země poskytla podmínky pro jeho vznik. Pokračující výzkum odhaluje soustavu mnohem dynamičtější a složitější, než se dříve předpokládalo.<br><br><a href='https://cs.wikipedia.org/wiki/Slune%C4%8Dn%C3%AD_soustava' target='_blank'>Wikipedia</a>"></div>

            <div class="hotspot" id="aboutCZ" data-title="O projektu" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Sluneční soustava slouží jako interaktivní vzdělávací průvodce naším kosmickým sousedstvím.<br><br>Projekt vytvořil Josef Handsuch v květnu roku 2026 s využitím programů VSCodium a Photoshop, materiálů z Wikipedie a za asistence umělé inteligence Gemini, Claude a ChatGPT (The EMH). Tato aplikace představuje osobní závazek ke vzdělávání v oblasti astronomie.<br><br><b>Odborný obsah zkontrolován a aktualizován:</b> listopad 2026.<br><br>Další projekty:<br><br><a href='https://aporuelab.github.io/earth-chronicle/cz.html'>Kronika Země</a><br>Interaktivní geologická časová osa Země"></div>

            <div class="hotspot" id="about" data-title="O projektu" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br>Sluneční soustava slouží jako interaktivní vzdělávací průvodce naším kosmickým sousedstvím.<br><br>Projekt vytvořil Josef Handsuch v květnu roku 2026 s využitím programů VSCodium a Photoshop, materiálů z Wikipedie a za asistence umělé inteligence Gemini, Claude a ChatGPT (The EMH). Tato aplikace představuje osobní závazek ke vzdělávání v oblasti astronomie.<br><br><b>Odborný obsah zkontrolován a aktualizován:</b> listopad 2026.<br><br>Další projekty:<br><br><a href='https://aporuelab.github.io/earth-chronicle/cz.html'>Kronika Země</a><br>Interaktivní geologická časová osa Země"></div>

            <div class="hotspot" id="xxx" data-title="Další projekty" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15tA-jNLkgXiow4OTe9aKOVwlp3zrLUxi' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br><a href='https://aporuelab.github.io/earth-chronicle'>The Earth Chronicle</a><br>Interaktivní geologická časová osa Země"></div>

            <div class="hotspot" id="language" data-title="English version" data-desc="<img src='https://lh3.googleusercontent.com/u/0/d/15OPacuEu5EG1Xo0mexgLop0m-feZOhLs' style='width:85%; display:block; margin:12px auto 12px auto; border-radius:6px;'><br><a href='https://aporuelab.github.io/solar-system/'>SWITCH TO ENGLISH</a>"></div>

    <div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9998;"></div>
    <div class="tooltip" id="info-bubble">
        <div class="tooltip-content">
            <h3 id="bubble-title">Název</h3>
            <p id="bubble-desc">Zde se zobrazí popis.</p>
        </div>
        <div class="tooltip-footer">
            <button id="close-btn">Zavřít</button>
        </div>
    </div>


    <section id="quiz-dialog" role="dialog" aria-modal="true" aria-labelledby="quiz-heading" tabindex="-1">
        <button id="quiz-x" type="button" aria-label="Zavřít kvíz">×</button>
        <h2 id="quiz-heading">Kvíz: Sluneční soustava</h2>
        <div id="quiz-progress"></div>
        <p id="quiz-question"></p>
        <div id="quiz-options"></div>
        <p id="quiz-feedback" aria-live="polite"></p>

    <!-- BOOKMARK: Script  -->
    <script>
        window.addEventListener('load', function () {
            const hotspots = document.querySelectorAll('.hotspot');
            hotspots.forEach(spot => {
                const desc = spot.getAttribute('data-desc');
                const match = desc.match(/src=['"]([^'"]+)['"]/);
                if (match && match[1]) {
                    const preloadImg = new Image();
                    preloadImg.src = match[1];
                }
            });
        });

        const hotspots = document.querySelectorAll('.hotspot');
        const bubble = document.getElementById('info-bubble');
        const bubbleTitle = document.getElementById('bubble-title');
        const bubbleDesc = document.getElementById('bubble-desc');
        const closeBtn = document.getElementById('close-btn');


        function openBubble() {
            document.getElementById('overlay').style.display = 'block';
            bubble.style.display = 'flex';
            positionBubble();
        }

        function positionBubble() {
            if (window.visualViewport) {
                const vv = window.visualViewport;
                const scale = 1 / vv.scale;
                bubble.style.position = 'fixed';
                bubble.style.top = (vv.offsetTop + vv.height / 2) + 'px';
                bubble.style.left = (vv.offsetLeft + vv.width / 2) + 'px';
                bubble.style.transform = `translate(-50%, -50%) scale(${scale})`;
                bubble.style.transformOrigin = 'center center';
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('scroll', () => {
                if (bubble.style.display === 'flex') positionBubble();
            });
            window.visualViewport.addEventListener('resize', () => {
                if (bubble.style.display === 'flex') positionBubble();
            });
        }

        function closeBubble() {
            bubble.style.display = 'none';
            bubble.style.transform = 'translate(-50%, -50%)';
            document.getElementById('overlay').style.display = 'none';
            document.body.style.overflow = '';
        }


        hotspots.forEach(spot => {
            spot.addEventListener('click', (e) => {
                e.stopPropagation();
                bubbleTitle.textContent = spot.getAttribute('data-title');
                bubbleDesc.innerHTML = spot.getAttribute('data-desc');
                openBubble();
            });
        });

        closeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeBubble();
        });

        document.addEventListener('click', (e) => {
            const isClickInsideBubble = bubble.contains(e.target);
            const isClickOnHotspot = Array.from(hotspots).some(spot => spot.contains(e.target));
            if (!isClickInsideBubble && !isClickOnHotspot) {
                closeBubble();
            }
        });

        function positionHeader() {
            if (window.visualViewport) {
                const vv = window.visualViewport;
                const header = document.getElementById('fixed-header');
                header.style.top = vv.offsetTop + 'px';
                header.style.left = vv.offsetLeft + 'px';
                header.style.width = vv.width + 'px';

                // Counteract zoom
                const scale = 1 / vv.scale;
                header.style.transformOrigin = 'top left';
                header.style.transform = `scale(${scale})`;
                header.style.width = (vv.width * vv.scale) + 'px';

                document.getElementById('header-spacer').style.height = header.offsetHeight + 'px';
            }
        }

        positionHeader();

        if (window.visualViewport) {
            window.visualViewport.addEventListener('scroll', positionHeader);
            window.visualViewport.addEventListener('resize', positionHeader);
        }

        window.addEventListener('load', function () {
            const hotspots = document.querySelectorAll('.hotspot');
            hotspots.forEach(spot => {
                const desc = spot.getAttribute('data-desc');
                const match = desc.match(/src=['"]([^'"]+)['"]/);
                if (match && match[1]) {
                    const preloadImg = new Image();
                    preloadImg.src = match[1];
                }
            });
        });




        /* Bilingual, self-contained quiz. No network requests or stored personal data. */
        (() => {
            const strings = {"launch":"KVÍZ","title":"Kvíz: Sluneční soustava","question":"Otázka","of":"z","score":"Body","correct":"Správně!","wrong":"Tentokrát ne.","next":"DALŠÍ","results":"Kvíz dokončen","again":"ZKUSIT ZNOVU","close":"Zavřít kvíz"};
            const bank = [["Která planeta je nejblíže Slunci?",["Merkur","Venuše","Země","Mars"],0,"Merkur je nejvnitřnější planetou Sluneční soustavy."],["Která planeta má největší průměr?",["Saturn","Jupiter","Neptun","Země"],1,"Jupiter je největší planetou Sluneční soustavy."],["Na kterém měsíci se nacházejí jezera a moře kapalného metanu a etanu?",["Europa","Titan","Io","Mimas"],1,"Titan, měsíc Saturnu, má jezera a moře kapalných uhlovodíků."],["Která planeta je známá Velkou rudou skvrnou?",["Neptun","Mars","Jupiter","Saturn"],2,"Velká rudá skvrna na Jupiteru je dlouhodobě přetrvávající atmosférická bouře."],["Který měsíc je vulkanicky nejaktivnějším tělesem Sluneční soustavy?",["Io","Europa","Triton","Ganymed"],0,"Jupiterův měsíc Io je mimořádně vulkanicky aktivní."],["Co se nachází převážně mezi Marsem a Jupiterem?",["Kuiperův pás","Hlavní pás planetek","Oortův oblak","Saturnovy prstence"],1,"Hlavní pás planetek obíhá mezi Marsem a Jupiterem."],["Která planeta rotuje téměř na boku?",["Venuše","Merkur","Uran","Neptun"],2,"Rotační osa Uranu je skloněna přibližně o 98 stupňů."],["Který měsíc je největší ve Sluneční soustavě?",["Titan","Callisto","Ganymed","Měsíc"],2,"Jupiterův Ganymed je největším měsícem Sluneční soustavy."],["Která planeta je známá svými výraznými prstenci?",["Mars","Saturn","Venuše","Merkur"],1,"Saturn má obzvlášť nápadnou soustavu prstenců."],["Která trpasličí planeta se nachází v hlavním pásu planetek?",["Pluto","Eris","Ceres","Haumea"],2,"Ceres obíhá v hlavním pásu planetek."],["Kolem které planety obíhá měsíc Triton?",["Neptun","Saturn","Uran","Mars"],0,"Triton je největším měsícem Neptunu."],["Čemu přibližně odpovídá astronomická jednotka (AU)?",["Vzdálenosti Země a Měsíce","Průměrné vzdálenosti Země a Slunce","Průměru Slunce","Vzdálenosti Jupiteru a Saturnu"],1,"Jedna AU přibližně odpovídá průměrné vzdálenosti Země od Slunce."],["Která planeta má nejvyšší průměrnou povrchovou teplotu?",["Merkur","Venuše","Mars","Země"],1,"Venuše je nejteplejší planetou kvůli silnému skleníkovému efektu."],["Která planeta má dva malé měsíce Phobos a Deimos?",["Země","Neptun","Mars","Merkur"],2,"Phobos a Deimos obíhají kolem Marsu."],["Co je Kuiperův pás?",["Oblak hvězd","Oblast za Neptunem s ledovými tělesy","Saturnovy prstence","Pás slunečních bouří"],1,"Kuiperův pás je oblast ledových těles za dráhou Neptunu."],["Které těleso obsahuje většinu hmotnosti Sluneční soustavy?",["Jupiter","Země","Slunce","Saturn"],2,"Slunce obsahuje přibližně 99,9 % celkové hmotnosti Sluneční soustavy."]];
            const dialog = document.getElementById('quiz-dialog');
            const launch = document.getElementById('quiz-launch');
            const exit = document.getElementById('quiz-x');
            const question = document.getElementById('quiz-question');
            const progress = document.getElementById('quiz-progress');
            const choices = document.getElementById('quiz-options');
            const feedback = document.getElementById('quiz-feedback');
            const next = document.getElementById('quiz-next');
            const overlay = document.getElementById('overlay');
            let round = [], at = 0, score = 0, answered = false;
            function position() {
                if (!window.visualViewport) return;
                const v = window.visualViewport;
                dialog.style.top = (v.offsetTop + v.height / 2) + 'px';
                dialog.style.left = (v.offsetLeft + v.width / 2) + 'px';
                dialog.style.transform = 'translate(-50%, -50%) scale(' + 1 / v.scale + ')';
                dialog.style.transformOrigin = 'center center';
            }
            function showQuestion() {
                answered = false;
                const [q, opts] = round[at];
                progress.textContent = strings.question + ' ' + (at + 1) + ' ' + strings.of + ' ' + round.length + ' · ' + strings.score + ': ' + score;
                question.textContent = q;
                feedback.textContent = '';
                choices.replaceChildren();
                next.style.display = 'none';
                opts.forEach((option, index) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'quiz-option';
                    b.textContent = option;
                    b.addEventListener('click', () => choose(index));
                    choices.appendChild(b);
                });
            }
            function choose(index) {
                if (answered) return;
                answered = true;
                const [, , correct, explanation] = round[at];
                if (index === correct) score++;
                choices.querySelectorAll('button').forEach((b, i) => {
                    b.disabled = true;
                    if (i === correct) b.classList.add('correct');
                    else if (i === index) b.classList.add('incorrect');
                });
                feedback.textContent = (index === correct ? strings.correct : strings.wrong) + ' ' + explanation;
                progress.textContent = strings.question + ' ' + (at + 1) + ' ' + strings.of + ' ' + round.length + ' · ' + strings.score + ': ' + score;
                next.style.display = 'block';
                next.textContent = at === round.length - 1 ? strings.results : strings.next;
            }
            function start() {
                round = [...bank].sort(() => Math.random() - .5).slice(0, 10);
                at = 0; score = 0;
                showQuestion();
                dialog.style.display = 'flex';
                overlay.style.display = 'block';
                position();
                dialog.focus();
            }
            function finish() {
                progress.textContent = strings.results;
                question.textContent = strings.score + ': ' + score + ' / ' + round.length;
                choices.replaceChildren();
                feedback.textContent = '';
                next.textContent = strings.again;
                next.style.display = 'block';
            }
            function close() {
                dialog.style.display = 'none';
                overlay.style.display = 'none';
                launch.focus();
            }
            launch.addEventListener('click', (e) => { e.stopPropagation(); start(); });
            dialog.addEventListener('click', e => e.stopPropagation());
            exit.addEventListener('click', close);
            next.addEventListener('click', () => {
                if (at >= round.length - 1 && answered) { start(); return; }
                at++;
                showQuestion();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && dialog.style.display === 'flex') close();
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('scroll', () => { if (dialog.style.display === 'flex') position(); });
                window.visualViewport.addEventListener('resize', () => { if (dialog.style.display === 'flex') position(); });
            }
        })();

    </script>
